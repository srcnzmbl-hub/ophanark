ık","Bereket, bolluk ve derin sezgi."],["mag-1-attart","Attart","Kadim dişil güç, bereket ve koruma."],["mag-2-valide","Valide","Ana şefkati, hatır ve koruyucu bilgelik."],["toprak-1-abanozun-carki","Abanoz'un Çarkı","Sağlam döngü, dayanıklılık ve kök."],["toprak-2-selana","Selana","Ay ışığı, değişen yüz ve sezgi."],["toprak-3-tattaret","Tattaret","Gizli hazine, içe saklanan değer."],["toprak-4-assyranta","Assyranta","Kadim bilgelik, derin hatıra."],["toprak-5-sunit","Sunit","Sağlam duruş, sabır ve metanet."],["toprak-6-turan","Turan","Atalardan miras, kök bağ."],["toprak-7-munzur","Munzur","Temiz akış, hayat kaynağı."],["ates-1-atesin-yakutu","Ateşin Yakutu","Kor, tutku ve kıvılcım."],["ates-2-ariman","Ariman","Karanlık güç, sınav ve gölge."],["ates-3-selcukassa","Selçukassa","Zafer, güç ve hüküm."],["ates-4-urmia","Urmia","Acı ama şifalı, iç temizlik."],["ates-5-saah","Saah","Umut ışığı, sabır ve niyet."],["ates-6-tagral","Tagral","Atılış, cesur adım."],["ates-7-kalif","Kalif","Liderlik, söz sahibi."],["su-1-zumrut","Zümrüt","Bereket, kalp şifası ve umut."],["su-2-bedes","Bedes","İkna, söz ve etki."],["su-3-mida","Mida","Bolluk, bereket ve akış."],["su-4-passandra","Passandra","Yolculuk, hareket ve akış."],["su-5-aral","Aral","Kapı, fırsat ve eşik."],["su-6-eprahhat","Eprahhat","Şifa, iç temizlik."],["su-7-hesse","Hesse","Gizli güç, iç zenginlik."],["hava-1-buyuk-elmas","Büyük Elmas","Safiyet, netlik ve değer."],["hava-2-isfahan","İsfahan","Zarafet, sanat ve denge."],["hava-3-dastar","Dastar","Onur, makam ve söz."],["hava-4-adhamdeva","Adhamdeva","Yüksek ideal, manevi yol."],["hava-5-gamhat","Gamhat","Birlik, bağ ve uzlaşma."],["hava-6-dare","Dare","Yuva, aidiyet ve iç huzur."],["hava-7-zara","Zara","Zerafet, dişil zarafet."],["deste-1-bos","Deste — Boş Kart","Henüz açılmamış niyet, boşluk."],["deste-2-bos","Deste — Boş Kart","Henüz açılmamış niyet, boşluk."],["deste-3-butunluk","Deste — Bütünlük","Birlik, bütün ve uyum."]],U1=hF.map(([t,e,n])=>({img:`${dF}/katina/${t}.webp`,name:e,meaning:n})),fF="https://raw.githubusercontent.com/srcnzmbl-hub/ophanark/main",mF=[[1,"Başmelek Mikail","koruma · cesaret",'Koruma ve cesaretin başmeleği; Ateş serisinin yöneticisidir. Korkularını kesip atman ve zor bir kararda dimdik durman için yanındadır; sana kalkan ve alevden kılıç olur. Mesajı: "Korkma, ben arkandayım."'],[2,"Cesaret","cesaret · korkuyu aşmak","Melekler cesur olmanı istiyor: içindeki korkuya rağmen o adımı at. Güç zaten sende; bir nefeslik cesaret yeter."],[3,"Koruma","güven · kalkan","Korunuyorsun. Görünür-görünmez tehlikelere karşı melekler etrafında bir kalkan örüyor; güvende olduğunu bil, endişeyi bırak."],[4,"Eyleme Geç","eylem · başlangıç","Beklemenin vakti geçti; harekete geçme zamanı. Küçük de olsa bir adım at, kapı sen yürüdükçe açılır."],[5,"Sınır Koy","sınır · öz-saygı","Kendini korumak bencillik değil. Enerjini tüketen şeye ya da kişiye nazikçe 'hayır' demen için melekler yanında."],[6,"Öz-Güven","güven · değer","Kendine güven; değerin başkasının onayına bağlı değil. Bu kart, içindeki gücü hatırlaman için geldi."],[7,"Tutku","tutku · kalp","Kalbini yakan şeyin peşinden git. Tutku, ruhunun sana 'bu yol senin' deme biçimidir."],[8,"Liderlik","liderlik · ilham","Öne çıkma, yön verme vakti. Başkalarına ilham olacak ışığın var; sorumluluğu üstlenmekten çekinme."],[9,"Arınma","arınma · hafifleme","Ağırlaştıran eski enerjiyi bırak. Melekler seni temizliyor; kızgınlığı ve yorgunluğu ateşe ver, hafifle."],[10,"İrade Gücü","irade · azim","İçindeki irade sandığından güçlü. Kararında dur, vazgeçme; azminle imkânsızı eğer."],[11,"Yeniden Doğuş","yenilenme · dönüşüm","Bir dönem kapanıyor, yenisi doğuyor. Küllerinden doğan bir ateşsin; geçmişi bırak, yeni ateşi yak."],[12,"Başmelek Cebrail","müjde · sezgi",'Müjde ve sezginin başmeleği; Su serisinin yöneticisidir. İçindeki sesi duyman ve yeni bir başlangıca güvenmen için yanında; yaratıcılığını açar. Mesajı: "Güzel bir haber yolda."'],[13,"Sevgi","sevgi · kalp","Sevgi kapını çalıyor. Melekler kalbini açmanı istiyor; hem vermeye hem almaya izin ver."],[14,"Sezgi","iç ses · his","İç sesin haklı. O ilk hissi görmezden gelme; cevap çoktan içine fısıldandı."],[15,"Duygularını Onurlandır","duygu · kabul","Hissettiğin şey geçerli. Duygularını bastırma; onları nazikçe kabul et, akıp geçmelerine izin ver."],[16,"Öz-Şefkat","şefkat · nezaket","Kendine, sevdiğin birine davranır gibi davran. Kendini yargılamayı bırak, yumuşa."],[17,"Affet","affetme · bırakma","Bir yükü bırakma vakti. Affetmek onu değil seni özgürleştirir; kalbindeki taşı indir."],[18,"Teslim Ol","akış · güven","Her şeyi kontrol etmek zorunda değilsin. Akışa güven; melekler senin için en hayırlısını dokuyor."],[19,"Rüya & İşaretler","rüya · sembol","Etrafındaki işaretlere ve rüyalarına dikkat et. Melekler seninle sembollerle konuşuyor."],[20,"İç Ses","sessizlik · rehberlik","Dışarının gürültüsünü kıs, içeriyi dinle. Aradığın rehberlik senin sessizliğinde."],[21,"Duygusal Şifa","şifa · onarım","Eski bir yara kapanıyor. Melekler kalbindeki kırığı sarıyor; iyileşmene izin ver, acele etme."],[22,"İlişki & Uyum","bağ · huzur","Bir bağ derinleşiyor ya da onarılıyor. Sevgiyle, sabırla yaklaş; aranıza huzur geliyor."],[23,"Başmelek Rafael","şifa · berraklık",'Şifanın başmeleği; Hava serisinin yöneticisidir. Beden-zihin-ruh sağlığında ve bir yarıyı iyileştirmede yanında; zihnini berraklaştırır. Mesajı: "İyileşeceksin."'],[24,"Şifa","iyileşme · özen","İyileşme başladı. Kendine iyi bak; melekler bedenine ve ruhuna şifa taşıyor, sabırlı ol."],[25,"Berraklık","netlik · sabır","Sis dağılıyor. Kafan karışıksa bekle; cevap yakında netleşecek, zorlama."],[26,"İletişim","ifade · söz","Konuş, ifade et, sustuğunu söyle. Açık ve nazik bir söz düğümü çözecek."],[27,"Hakikat","gerçek · dürüstlük","Gerçeği gör ve söyle. Melekler perdenin ardını göstermene, dürüst olmana destek veriyor."],[28,"İlham","fikir · yaratıcılık","Bir fikir kapını çalıyor. Zihnini aç; ilham bir melek dokunuşudur, onu yakala."],[29,"Zihnini Sakinleştir","sükunet · nefes","Aşırı düşünmeyi bırak. Bir nefes al; melekler zihnindeki fırtınayı dindiriyor."],[30,"Öğrenme & Bilgi","öğrenme · yol","Öğrenmeye açık ol. Bir bilgi, bir ders, bir kitap tam da şimdi sana yol gösterecek."],[31,"Bakış Açını Değiştir","perspektif · esneklik","Soruna başka bir pencereden bak. 'Aynı manzara farklı yerden güzel' diyor melekler."],[32,"Özgürlük","özgürlük · kanat","Seni sıkan kalıbı gevşet. Ruhun özgürlük istiyor; kanatlarını açmana izin ver."],[33,"Endişeyi Sal","teslimiyet · huzur","Endişeni meleklere bırak. Taşıdığın yükünün çoğu daha olmadı bile; bugüne dön, nefes al."],[34,"Başmelek Uriel","bilgelik · istikrar",'Bilgelik ve istikrarın başmeleği; Toprak serisinin yöneticisidir. Çözülmeyen bir sorunu aydınlatman ve ayaklarını yere basmanda yanında. Mesajı: "İçindeki bilgelik yolu aydınlatacak."'],[35,"Bolluk","bolluk · açıklık","Bolluk sana akıyor. Kıtlık korkusunu bırak; açık ellerle ver ve al, kucağın dolsun."],[36,"Bereket & Şans","bereket · fırsat","Şans kapıları aralanıyor. Emeğin bereketle dönecek; fırsatı gördüğünde 'evet' de."],[37,"Sabır","sabır · zamanlama","Acele etme; her şey doğru zamanında. Tohum toprakta olgunlaşıyor, güven ve bekle."],[38,"Sağlam Temel","istikrar · inşa","Kalıcı bir şey inşa ediyorsun. Yavaş ama sağlam ilerle; melekler temelini tutuyor."],[39,"Sağlık & Beden","sağlık · denge","Bedenine kulak ver. Dinlen, beslen, hareket et; melekler sağlığına özen göstermeni istiyor."],[40,"Şükür","şükür · minnet","Sahip olduklarına şükret. Şükür bereketin anahtarıdır; bugün üç güzelliği say."],[41,"Şimdiye Dön","topraklanma · an","Zihnin geleceğe kaçıyorsa geri dön. Ayaklarını yere bas, bu ana gel; huzur şimdide."],[42,"Emek & Sadakat","emek · sebat","Emeğin boşa gitmiyor. Sabırla ve sadakatle çalışmaya devam et; karşılığı katlanarak gelecek."],[43,"Yeterlilik","değer · güven","Yeterince iyisin, yeterince varsın. Melekler 'eksik değilsin' diyor; kendine güven."],[44,"Nimet","kutsanma · lütuf","Görü ın. Geleneğe göre kalp, sırt ve gözler senin bölgen — stresi ve yorgunluğu kalbine yükleme. Güneşe, harekete ve neşeye aç kalma; ışıktan uzaklaştığında enerjin de söner.",ruh:'Ruhsal olgunluğun "ben"den "biz"e geçmekle gelir. Güneş gösteriş için değil, çevresine hayat vermek için parlar; sen de en çok verdiğinde huzur bulursun. Kibri bırakıp şükrü öğrendiğinde içindeki ışık gerçek bir aydınlığa döner.'},kamer:{ad:"Kamer",mod:"Ay",sym:"☾",no:2,gun:"Pazartesi",renk:"İnci beyazı, gümüş, gök mavisi",renkHex:"#cfd8e3",tas:"İnci ve aytaşı",kw:"Sezgi · Duygu · Şefkat",char:"Yıldızın Kamer, yani Ay. Duyguların derin ve gel-gitlidir; çevreni sezgiyle okur, söylenmeyeni hissedersin. Şefkatli, hayal gücü güçlü, koruyucu bir yanın var — insanlar yanında kendini güvende hisseder. İçinde bir çocuk saflığı ve bir anne sıcaklığı aynı anda yaşar.",kader:"Kaderin dalgalar hâlinde ilerler: inişli çıkışlı ama akışkan. Bir dönem çekilir, bir dönem dolarsın; bu senin zayıflığın değil, ritmin. Suyun taşı zamanla yontması gibi, sabırla ve sezgiyle en sert kapıları yumuşatırsın. Yuva, aile ve şefkatle kurduğun bağlar kaderinin can damarıdır.",ogut:"Duygularına kapılıp savrulma; ama onları bastırma da — sezgin senin pusulan. Her hissi büyütmeden önce bir gece bekle, sabah daha berrak görürsün.",ask:"Aşkta derin, şefkatli ve bağlanan bir kalbin var; sevdiğine yuva kurar, onu duygusal olarak sararsın. Güven hissettiğinde açılır, tehdit sezdiğinde kabuğuna çekilirsin. Sana sabırla ve sıcaklıkla yaklaşan biri, kalbinin en derin sularını görür — asıl mesele sevilmek kadar güvende hissetmektir.",is:"Rızkın halkla, hizmetle ve akışkan işlerle açılır: yiyecek-içecek, su, seyahat, emlak, bakım ve insanlarla birebir temas. Sezgin ticarette pusuladır; ortamın nabzını tutmayı bilirsin. Kaderin gibi kazancın da gel-gitlidir — bollukta biriktirmeyi öğrenirsen darlıkta rahat edersin.",saglik:"Bedenin duygularının aynasıdır; stres önce mideni ve uykunu vurur. Geleneğe göre mide, göğüs ve vücut sıvıları senin bölgen; su içmek, dinlenmek ve içini boşaltmak sana şifadır. Ay gibi ritmini tanı — kendini zorladığın değil, aktığın dönemlerde güçlüsün.",ruh:"Ruhsal gücün sezgindedir; içindeki sesi bastırdıkça yorulur, dinledikçe berraklaşırsın. Duyguyu düşman değil rehber bil. Geçmişi ve incinmeleri suya bırakmayı öğrendiğinde için huzurla dolar."},utarit:{ad:"Utarit",mod:"Merkür",sym:"☿",no:5,gun:"Çarşamba",renk:"Turkuaz, açık mavi, yeşil",renkHex:"#3aa6b9",tas:"Zümrüt ve akik",kw:"Zekâ · Söz · Ticaret",char:"Yıldızın Utarit, yani Merkür. Zekân hızlı, dilin akıcı, öğrenmen çabuktur. Kelimelerle, fikirlerle, alışverişle aran iyidir; bir konuyu kavrayıp başkasına anlatmak senin doğal yeteneğin. Meraklı ve çok yönlüsün, tek bir işe sığmazsın; elin de dilin de pratiktir.",kader:"Kaderin bilgi ve iletişim yollarından geçer: yazı, sözleşme, ticaret, öğretmenlik, aracılık… Söz söyleyeceğin, bağ kuracağın, alıp satacağın yerlerde şansın açıktır. Doğru bilgiyi doğru zamanda söylemek sana kapılar açar; kalemin ve dilin kaderinin anahtarıdır.",ogut:"Zihnin çok hızlı çalışıyor; bazen dur ve başladığın işi bitir. Her yöne koşarsan gücün de dağılır — bir kanala aktığında nehir olursun.",ask:"Aşkta önce zihnin bağlanır; seni güldüren, seninle konuşabilen biri kalbini de açar. Sohbet, mektup, kelime senin sevgi dilin. Fazla analiz edip duyguyu kafanda eritme; bazen düşünmeden hissetmek gerekir.",is:"Rızık kapın söz ve bilgiden geçer: yazı, ticaret, öğretmenlik, aracılık, medya, hesap ve sözleşme. Doğru bilgiyi doğru zamanda söylemek sana kapı açar; kalemin ve dilin kaderinin anahtarı. Tek işe sığmaz, birden çok gelir kanalını rahat yönetirsin.",saglik:'Enerjin zihninde toplanır; en çok sinir sistemin, ellerin ve nefesin (akciğer) yorulur. Aşırı düşünce uykunu kaçırır — zihnini durdurmayı, nefes almayı öğren. Bedenin dinlenmekten çok "boşalmaya" ihtiyaç duyar: yaz, konuş, yürü, hafifle.',ruh:"Ruhsal yolun dağınık zihni toplamaktan geçer. Her yöne koşan aklını tek bir niyete akıttığında güç bir nehre döner. Bildiğini paylaşmak seni bilgelikle besler."},zuhre:{ad:"Zühre",mod:"Venüs",sym:"♀",no:6,gun:"Cuma",renk:"Yeşil, pembe, pastel tonlar",renkHex:"#4CAF7D",tas:"Zümrüt ve pembe kuvars",kw:"Sevgi · Güzellik · Uyum",char:"Yıldızın Zühre, yani Venüs. Sevgi, güzellik ve uyum senin doğanda. Estetik bir gözün, insanları yumuşatan bir çekimin var; sanat, zarafet ve ilişkiler senin alanın. Kavgadan değil, uzlaşmadan güç alırsın; girdiğin ortama incelik ve huzur taşırsın.",kader:"Kaderin sevgi ve ortaklıklar üzerinden şekillenir. Güzel şeyler seni bulur, insanlar sana iyilik yapmak ister; çoğu kapı senin için sevgiyle açılır. Bir işi tek başına zorlamaktan çok, doğru kişiyle el ele vererek büyürsün. Aşk, dostluk ve ortaklık kaderinin taşıyıcı sütunudur.",ogut:'Herkesi memnun etme derdi seni yorabilir; kendi değerini başkasının onayına bağlama. "Hayır" demeyi öğrendiğinde sevgin daha da kıymetlenir.',ask:"Aşk senin en güçlü alanın; sevgi, çekim ve uyum doğanda. Zarif, romantik ve uzlaşmacısın; girdiğin ilişkiye incelik ve huzur taşırsın. Ama herkesi memnun etme çaban seni silikleştirebilir — sevildiğin kadar kendine de değer ver.",is:"Rızkın sevgi, güzellik ve ortaklıklarla akar: sanat, estetik, moda, diplomasi, halkla ilişkiler, keyif ve konfor işleri. İnsanlar sana iyilik yapmak, seninle çalışmak ister; çoğu kapı senin için sevgiyle açılır. Tek başına zorlamaktan çok, doğru ortakla el ele büyürsün.",saglik:"Bedenin keyfe ve tatlıya düşkün; en çok boğaz, böbrekler ve şeker/denge senin bölgen. Aşırı rahatlık ve tatlı seni ağırlaştırabilir — güzelliğin kadar ölçün de olsun. Sanat, müzik ve doğa sana en iyi gelen şifadır.",ruh:'Ruhsal olgunluğun kendi değerini dışarıdan onaya bağlamamakla gelir. "Hayır" diyebildiğinde sevgin daha da kıymetlenir. Güzelliği sahiplenmek değil, paylaşmak seni yüceltir.'},merih:{ad:"Merih",mod:"Mars",sym:"♂",no:9,gun:"Salı",renk:"Kırmızı, kızıl, bordo",renkHex:"#c0392b",tas:"Yakut ve kızıl akik",kw:"Cesaret · Enerji · Mücadele",char:"Yıldızın Merih, yani Mars. İçinde güçlü bir enerji, cesaret ve mücadele gücü var. Harekete geçmekten korkmazsın; engel gördüğünde geri çekilmez, üstüne gidersin. Açık sözlü, atılgan ve korunmacısın — haksızlığa tahammülün yoktur, sevdiğin için savaşırsın.",kader:"Kaderin mücadeleyle ve cesaretle açılır. Rekabetin, sporun, girişimin, öncülüğün olduğu yerde parlarsın; kolay kazanılan değil, savaşarak kazanılan zaferler senindir. Hayat seni sık sık sınar ama her sınav seni güçlendirir — düştüğün yerden daha sert kalkarsın.",ogut:"Öfken en büyük enerjin ama en büyük tuzağın; onu yıkmak için değil, kurmak için kullan. Sabretmeyi öğrenen bir Merih durdurulamaz.",ask:"Aşkta tutkulu, koruyucu ve sahiplenicisin; sevdiğin için savaşır, önüne geçilmezsin. Ateşin çeker ama kıskançlık ve inat ilişkini yıpratabilir. Enerjini kavgaya değil tutkuya ve korumaya akıttığında en sadık, en cesur sevgili sensin.",is:"Rızkın mücadeleyle açılır: rekabet, girişim, spor, ordu-emniyet, demir-ateş işleri, cerrahlık, öncülük. Kolay değil, savaşarak kazanılan zaferler senindir; risk aldığın yerde parlarsın. Kendi işini kurmak, patron olmak sana emir almaktan daha çok yakışır.",saglik:"Enerjin yüksek ama ateşlidir; en çok kan, baş, kaslar ve iltihap/kaza senin bölgen. Öfke ve acele bedenine yük olur — sporla, hareketle enerjini boşalt. Sabırsızlıktan doğan kazalara dikkat; gücünü kontrol etmeyi öğrendiğinde durdurulamazsın.",ruh:"Ruhsal sınavın öfkeni ustalaştırmaktır. Ateş yıkmak için de kurmak için de kullanılır — sen kurmayı seç. Sabreden bir Merih, en büyük savaşı kendi içinde kazanır."},musteri:{ad:"Müşteri",mod:"Jüpiter",sym:"♃",no:3,gun:"Perşembe",renk:"Lacivert, mor, sarı",renkHex:"#3f51b5",tas:"Safir ve lapis lazuli",kw:"Bereket · Adalet · Bilgelik",char:"Yıldızın Müşteri, yani Jüpiter. Geniş bir gönlün, güçlü bir adalet duygun ve bereketli bir enerjin var. İnsanlar sana akıl danışır; öğretmek, yol göstermek, büyütmek senin doğanda. İyimser ve hoşgörülüsün, bardağın dolu tarafını görürsün; bulunduğun yere bolluk ve güven getirirsin.",kader:"Kaderin genişleme ve bereket üzerine kuruludur. Doğru niyetle attığın adım büyür, bollukla geri döner; darlıkta bile bir kapı sana açılır. Bilgi, inanç, hukuk, eğitim ve yurt dışıyla bağlı yollarda şansın yüksektir. Cömertliğin sana daha çoğu olarak geri gelir.",ogut:'Cömertliğin güzel ama sınırını bil; her yükü sen taşıyamazsın. "Her şeyi ben bilirim" demek büyümeni durdurur — öğrenmeye açık kaldıkça bilgeleşirsin.',ask:"Aşkta cömert, sadık ve büyük gönüllüsün; sevdiğine alan açar, onu büyütürsün. Aile, ortak değerler ve gelecek vaadi senin için önemli. Fazla hoşgörü seni suistimale açık kılabilir — sınır koymak sevgini değersizleştirmez, korur.",is:"Rızkın genişlemeyle gelir: hukuk, eğitim, din-maneviyat, danışmanlık, yayıncılık, yurt dışı ve büyük ölçekli işler. Doğru niyetle attığın adım bollukla döner; darlıkta bile sana bir kapı açılır. Cömertliğin ve itibarın en büyük sermayen.",saglik:'Bedenin bereketli ama fazlaya kaçabilir; en çok karaciğer, kan ve kilo/aşırılık senin bölgen. "Her şeyin fazlası" seni yorar — bollukta ölçüyü elden bırakma. Doğa, yürüyüş ve sadelik sana denge verir.',ruh:'Ruhsal yolun tevazuda. "Her şeyi ben bilirim" dediğin an büyümen durur; öğrenmeye açık kaldıkça bilgeleşirsin. Verdiğin bereket, şükürle kat kat geri döner.'},zuhal:{ad:"Zühal",mod:"Satürn",sym:"♄",no:8,gun:"Cumartesi",renk:"Koyu gri, siyah, lacivert",renkHex:"#4a4a55",tas:"Oniks ve hematit",kw:"Sabır · Disiplin · Dayanıklılık",char:"Yıldızın Zühal, yani Satürn. Sabırlı, disiplinli, ciddi ve dayanıklısın. Kolay yoldan değil, emekle ve zamanla kazanırsın; sözünün eri, güvenilir, ayakları yere basan bir yapın var. Belki gençken yaşından olgun görünürsün — hayat sana erken sorumluluk yükler ama bu seni sağlamlaştırır.",kader:"Kaderin yavaş ama sağlam ilerler. Başlangıçlar zorlu olabilir; emeğinin karşılığını hemen değil, zamanla ve katlanarak alırsın. Zühal geç ama kalıcı ödüllendirir: yaşın ilerledikçe güçlenir, kök saldıkça devrilmezsin. Sabrınla kurduğun her şey senden sonra da ayakta kalır.",ogut:"Kendine ve dünyaya fazla sert bakma; her şeyi tek başına taşımak zorunda değilsin. Sabrın kadar affetmeyi de öğren — o zaman yükün hafifler, yolun uzar.",ask:"Aşkta ağır, ölçülü ve sadıksın; kalbini kolay açmaz ama açtığında ömürlük durursun. Sana güven ve zaman gerekir; aceleye gelmezsin. Soğuk göründüğün yerde aslında derin bir bağlılık saklarsın — bunu göstermeyi öğrendiğinde sevgin sarsılmaz olur.",is:"Rızkın emek ve sabırla, yavaş ama sağlam gelir: toprak, gayrimenkul, inşaat, madencilik, devlet ve uzun soluklu ciddi işler. Başlangıçlar zor olabilir ama kurduğun her şey kalıcıdır. Yaşın ilerledikçe güçlenir, kök saldıkça devrilmezsin.",saglik:"Bedenin dayanıklı ama yavaş; en çok kemikler, dişler, eklemler ve kronik-soğuk şikâyetler senin bölgen. Kendini fazla yükleme, dinlenmeyi zayıflık sanma. Düzen, sıcaklık ve düzenli hareket sana en iyi gelen ilaçtır.",ruh:"Ruhsal sınavın katılığı yumuşatmaktır. Her yükü tek başına taşımak zorunda değilsin; affetmeyi öğrendiğinde yükün hafifler. Sabrın bilgeliğe, disiplinin huzura döner."}},a4={sems:{sems:"ayna",kamer:"dost",merih:"dost",musteri:"dost",utarit:"notr",zuhre:"zorlu",zuhal:"zorlu"},kamer:{kamer:"ayna",sems:"dost",utarit:"dost",merih:"notr",musteri:"notr",zuhre:"notr",zuhal:"zorlu"},merih:{merih:"ayna",sems:"dost",kamer:"dost",musteri:"dost",zuhre:"notr",zuhal:"notr",utarit:"zorlu"},utarit:{utarit:"ayna",sems:"dost",zuhre:"dost",merih:"notr",musteri:"notr",zuhal:"notr",kamer:"zorlu"},musteri:{musteri:"ayna",sems:"dost",kamer:"dost",merih:"dost",zuhal:"notr",zuhre:"zorlu",utarit:"zorlu"},zuhre:{zuhre:"ayna",utarit:"dost",zuhal:"dost",merih:"notr",musteri:"notr",sems:"zorlu",kamer:"zorlu"},zuhal:{zuhal:"ayna",utarit:"dost",zuhre:"dost",musteri:"notr",sems:"zorlu",kamer:"zorlu",merih:"zorlu"}},o4={ayna:{score:85,lvl:"Ayna Ruhlar",txt:"Aynı yıldızı paylaşıyorsunuz. Birbirinizi sözsüz anlarsınız çünkü aynı dilden konuşursunuz; ama aynı göl
