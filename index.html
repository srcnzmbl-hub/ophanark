 olmanı istiyor: içindeki korkuya rağmen o adımı at. Güç zaten sende; bir nefeslik cesaret yeter."],[3,"Koruma","güven · kalkan","Korunuyorsun. Görünür-görünmez tehlikelere karşı melekler etrafında bir kalkan örüyor; güvende olduğunu bil, endişeyi bırak."],[4,"Eyleme Geç","eylem · başlangıç","Beklemenin vakti geçti; harekete geçme zamanı. Küçük de olsa bir adım at, kapı sen yürüdükçe açılır."],[5,"Sınır Koy","sınır · öz-saygı","Kendini korumak bencillik değil. Enerjini tüketen şeye ya da kişiye nazikçe 'hayır' demen için melekler yanında."],[6,"Öz-Güven","güven · değer","Kendine güven; değerin başkasının onayına bağlı değil. Bu kart, içindeki gücü hatırlaman için geldi."],[7,"Tutku","tutku · kalp","Kalbini yakan şeyin peşinden git. Tutku, ruhunun sana 'bu yol senin' deme biçimidir."],[8,"Liderlik","liderlik · ilham","Öne çıkma, yön verme vakti. Başkalarına ilham olacak ışığın var; sorumluluğu üstlenmekten çekinme."],[9,"Arınma","arınma · hafifleme","Ağırlaştıran eski enerjiyi bırak. Melekler seni temizliyor; kızgınlığı ve yorgunluğu ateşe ver, hafifle."],[10,"İrade Gücü","irade · azim","İçindeki irade sandığından güçlü. Kararında dur, vazgeçme; azminle imkânsızı eğer."],[11,"Yeniden Doğuş","yenilenme · dönüşüm","Bir dönem kapanıyor, yenisi doğuyor. Küllerinden doğan bir ateşsin; geçmişi bırak, yeni ateşi yak."],[12,"Başmelek Cebrail","müjde · sezgi",'Müjde ve sezginin başmeleği; Su serisinin yöneticisidir. İçindeki sesi duyman ve yeni bir başlangıca güvenmen için yanında; yaratıcılığını açar. Mesajı: "Güzel bir haber yolda."'],[13,"Sevgi","sevgi · kalp","Sevgi kapını çalıyor. Melekler kalbini açmanı istiyor; hem vermeye hem almaya izin ver."],[14,"Sezgi","iç ses · his","İç sesin haklı. O ilk hissi görmezden gelme; cevap çoktan içine fısıldandı."],[15,"Duygularını Onurlandır","duygu · kabul","Hissettiğin şey geçerli. Duygularını bastırma; onları nazikçe kabul et, akıp geçmelerine izin ver."],[16,"Öz-Şefkat","şefkat · nezaket","Kendine, sevdiğin birine davranır gibi davran. Kendini yargılamayı bırak, yumuşa."],[17,"Affet","affetme · bırakma","Bir yükü bırakma vakti. Affetmek onu değil seni özgürleştirir; kalbindeki taşı indir."],[18,"Teslim Ol","akış · güven","Her şeyi kontrol etmek zorunda değilsin. Akışa güven; melekler senin için en hayırlısını dokuyor."],[19,"Rüya & İşaretler","rüya · sembol","Etrafındaki işaretlere ve rüyalarına dikkat et. Melekler seninle sembollerle konuşuyor."],[20,"İç Ses","sessizlik · rehberlik","Dışarının gürültüsünü kıs, içeriyi dinle. Aradığın rehberlik senin sessizliğinde."],[21,"Duygusal Şifa","şifa · onarım","Eski bir yara kapanıyor. Melekler kalbindeki kırığı sarıyor; iyileşmene izin ver, acele etme."],[22,"İlişki & Uyum","bağ · huzur","Bir bağ derinleşiyor ya da onarılıyor. Sevgiyle, sabırla yaklaş; aranıza huzur geliyor."],[23,"Başmelek Rafael","şifa · berraklık",'Şifanın başmeleği; Hava serisinin yöneticisidir. Beden-zihin-ruh sağlığında ve bir yarıyı iyileştirmede yanında; zihnini berraklaştırır. Mesajı: "İyileşeceksin."'],[24,"Şifa","iyileşme · özen","İyileşme başladı. Kendine iyi bak; melekler bedenine ve ruhuna şifa taşıyor, sabırlı ol."],[25,"Berraklık","netlik · sabır","Sis dağılıyor. Kafan karışıksa bekle; cevap yakında netleşecek, zorlama."],[26,"İletişim","ifade · söz","Konuş, ifade et, sustuğunu söyle. Açık ve nazik bir söz düğümü çözecek."],[27,"Hakikat","gerçek · dürüstlük","Gerçeği gör ve söyle. Melekler perdenin ardını göstermene, dürüst olmana destek veriyor."],[28,"İlham","fikir · yaratıcılık","Bir fikir kapını çalıyor. Zihnini aç; ilham bir melek dokunuşudur, onu yakala."],[29,"Zihnini Sakinleştir","sükunet · nefes","Aşırı düşünmeyi bırak. Bir nefes al; melekler zihnindeki fırtınayı dindiriyor."],[30,"Öğrenme & Bilgi","öğrenme · yol","Öğrenmeye açık ol. Bir bilgi, bir ders, bir kitap tam da şimdi sana yol gösterecek."],[31,"Bakış Açını Değiştir","perspektif · esneklik","Soruna başka bir pencereden bak. 'Aynı manzara farklı yerden güzel' diyor melekler."],[32,"Özgürlük","özgürlük · kanat","Seni sıkan kalıbı gevşet. Ruhun özgürlük istiyor; kanatlarını açmana izin ver."],[33,"Endişeyi Sal","teslimiyet · huzur","Endişeni meleklere bırak. Taşıdığın yükünün çoğu daha olmadı bile; bugüne dön, nefes al."],[34,"Başmelek Uriel","bilgelik · istikrar",'Bilgelik ve istikrarın başmeleği; Toprak serisinin yöneticisidir. Çözülmeyen bir sorunu aydınlatman ve ayaklarını yere basmanda yanında. Mesajı: "İçindeki bilgelik yolu aydınlatacak."'],[35,"Bolluk","bolluk · açıklık","Bolluk sana akıyor. Kıtlık korkusunu bırak; açık ellerle ver ve al, kucağın dolsun."],[36,"Bereket & Şans","bereket · fırsat","Şans kapıları aralanıyor. Emeğin bereketle dönecek; fırsatı gördüğünde 'evet' de."],[37,"Sabır","sabır · zamanlama","Acele etme; her şey doğru zamanında. Tohum toprakta olgunlaşıyor, güven ve bekle."],[38,"Sağlam Temel","istikrar · inşa","Kalıcı bir şey inşa ediyorsun. Yavaş ama sağlam ilerle; melekler temelini tutuyor."],[39,"Sağlık & Beden","sağlık · denge","Bedenine kulak ver. Dinlen, beslen, hareket et; melekler sağlığına özen göstermeni istiyor."],[40,"Şükür","şükür · minnet","Sahip olduklarına şükret. Şükür bereketin anahtarıdır; bugün üç güzelliği say."],[41,"Şimdiye Dön","topraklanma · an","Zihnin geleceğe kaçıyorsa geri dön. Ayaklarını yere bas, bu ana gel; huzur şimdide."],[42,"Emek & Sadakat","emek · sebat","Emeğin boşa gitmiyor. Sabırla ve sadakatle çalışmaya devam et; karşılığı katlanarak gelecek."],[43,"Yeterlilik","değer · güven","Yeterince iyisin, yeterince varsın. Melekler 'eksik değilsin' diyor; kendine güven."],[44,"Nimet","kutsanma · lütuf","Görünmez bir bereketle kutsanıyorsun. Fark et, minnet duy; iyi şeyler yolda ve sen bunu hak ediyorsun."]],I1=uz.map(([t,e,n,r])=>({img:`${lz}/melek/melek-${String(t).padStart(2,"0")}.webp`,name:e,kicker:n,meaning:r}));function cz({item:t,list:e,onSelect:n,onBack:r}){return d.jsxs(Ee.div,{initial:{opacity:0,y:24},animate:{opacity:1,y:0},exit:{opacity:0,y:-24},transition:{duration:.6},className:"relative z ir Büyücüleri' kitabında anlatılan bu geleneğe göre eski İzmir büyücüleri bu deste ile yalnızca aşk falı bakmaz, aynı zamanda büyü de yaparlardı. Ophan, bu kadim İzmir destesini senin hikâyen için okur.",melek:"Melek kelimesi, kadim İbrani dilinde 'elçi, mesaj getiren' demektir. Melek kartları, kadim Kabala geleneğindeki melek hiyerarşisinden ve her meleğin özel isminden — Mikael, Gabriel, Rafael, Uriel — ilham alır. Kabala'ya göre her insanın bir koruyucu meleği vardır; Ophan, bu koruyucu varlıkların fısıltısını senin için okur.",kahve:"Kahve falı, Türk kahvesinin Osmanlı saraylarına girdiği 16. yüzyılda doğdu; telvenin fincanda bıraktığı izler, yüzyıllardır bir sessiz dil olarak okundu. Fincanın içindeki biçimler simgesel bir hikâye taşır — Ophan, bu kadim Osmanlı geleneğini senin fincanın için okur.",el:"El falı — chiromancy — binlerce yıldır hem Hint alt kıtasında hem kadim Çin'de uygulanan bir okuma sanatıdır; avuçtaki çizgiler yaşamın üç büyük hattını — kalp, kafa, yaşam — taşır. Ophan, bu kadim çizgileri senin elinin üzerinden okur.",numeroloji:"Numerolojinin Batı'daki kökü Pisagor'a dayanır; 'evren sayıların ahengiyle oluşmuştur' demiş ve sayılara mistik anlamlar yüklemiştir. Kökeni ise Mezopotamya'ya, Kalde (Chaldean) numerolojisine kadar uzanır. Ophan, ismin ve doğumunun sayılarını senin için okur.",yildizname:"Yıldızname, Osmanlı müneccimlerinin uyguladığı kadim bir okumadır; kişinin adı ve anne adının ebced hesabıyla yıldız haritası çıkarılır. Ebced, Arap alfabesindeki harflerin sayısal değerlerine karşılık gelen kadim bir hesap sistemidir. Ophan, bu Osmanlı geleneğini senin için okur."};function Cm({item:t,onContinue:e}){const n=dz[t.slug],r=Ms();return d.jsxs(Ee.div,{initial:{opacity:0,y:24},animate:{opacity:1,y:0},exit:{opacity:0,y:-24},transition:{duration:.6},className:"relative z-10 mx-auto flex max-w-xl flex-col items-center text-center",children:[d.jsx("p",{className:"text-[10px] uppercase tracking-[.42em] text-[#D4AF37]",children:t.kicker}),d.js et",body:"Merkür gibi hızlı, zeki, meraklı ve çok yönlüsün. Özgürlük, seyahat, değişim ve iletişim seni besler; tek bir kalıba sığmazsın. İnsanları kolayca etkiler, çabuk öğrenirsin. Gölgen savrukluk ve huzursuzluk — enerjini bir yöne akıttığında olağanüstü işler çıkarırsın."},6:{t:"Sevgiyle Bağlanan",kw:"Sevgi · Uyum · Sorumluluk",body:"Venüs'ün sıcaklığını taşırsın: sevgi dolu, estetik, sorumlu ve şefkatli. Aile, güzellik ve uyum senin için kutsaldır; sevdiklerin için bir sığınak olursun. Gölgen fazla fedakarlık ve kaygı — kendine de sevgiyle baktığında verdiğin sevgi tükenmez bir kaynağa dönüşür."},7:{t:"Bilge Arayıcı",kw:"Maneviyat · Sezgi · Derinlik",body:"Neptün'ün gizemini taşırsın: içe dönük, sezgisel, derin ve ruhsal. Yüzeyle yetinmez, şeylerin ardındaki anlamı ararsın; yalnızlığın sana bilgelik getirir. Gölgen kaçış ve kopukluk olabilir — iç sesine güvendiğinde adeta görünmeyeni görürsün."},8:{t:"Usta",kw:"Güç · Adalet · Dayanıklılık",body:"Satürn'ün otoritesini taşırsın: güçlü, disiplinli, maddeyi ve dünyayı yönetmeye yatkın. Hayat sana ağır sınavlar verir ama her sınav seni bilenir; adaleti ve emeği önemsersin. Gölgen sertlik ve takıntı — sabırla yürüdüğünde büyük başarılar ve kalıcı bir güç seni bekler."},9:{t:"Tamamlayan",kw:"Cesaret · Tutku · İnsanlık",body:"Mars'ın ateşini taşırsın: cesur, tutkulu, mücadeleci ve büyük kalpli. Biten döngüleri kapatır, yeniye alan açarsın; insanlık ve idealler için savaşırsın. Gölgen öfke ve sabırsızlık — enerjini şefkatle yönlendirdiğinde gerçek bir kahramana dönüşürsün."}},yi={life:"Doğum tarihinden doğar — bu hayattaki ana temanı ve ruhunun yürüdüğü yolu anlatır.",name:"Adının Keldani titreşimi — dünyada nasıl tanındığını ve kaderinin dışa yansıyan yüzünü gösterir.",soul:"Adındaki sesli harflerden doğar — kalbinin gerçekte ne istediğini, seni içten neyin beslediğini fısıldar.",pers:"Adındaki sessiz harflerden gelir — insanların seni ilk gördüğünde algıladığı dış yüzündür.",birth:"Doğduğun günün sayısı — doğuştan gel bir zırh sanma; kırılganlığını göstermek seni küçültmez. Ama herkesin senin etrafında dönmesini beklersen yalnız kalırsın — ışığını paylaş, tek başına parlama."},kamer:{ad:"Kamer",mod:"Ay",sym:"☾",no:2,gun:"Pazartesi",renk:"İnci beyazı, gümüş, gök mavisi",renkHex:"#cfd8e3",tas:"İnci ve aytaşı",kw:"Sezgi · Duygu · Şefkat",char:"Yıldızın Kamer, yani Ay. Duyguların derin ve gel-gitlidir; çevreni sezgiyle okur, söylenmeyeni hissedersin. Şefkatli, hayal gücü güçlü, koruyucu bir yanın var — insanlar yanında kendini güvende hisseder. İçinde bir çocuk saflığı ve bir anne sıcaklığı aynı anda yaşar.",kader:"Kaderin dalgalar hâlinde ilerler: inişli çıkışlı ama akışkan. Bir dönem çekilir, bir dönem dolarsın; bu senin zayıflığın değil, ritmin. Suyun taşı zamanla yontması gibi, sabırla ve sezgiyle en sert kapıları yumuşatırsın. Yuva, aile ve şefkatle kurduğun bağlar kaderinin can damarıdır.",ogut:"Duygularına kapılıp savrulma; ama onları bastırma da — sezgin senin pusulan. Her hissi büyütmeden önce bir gece bekle, sabah daha berrak görürsün."},utarit:{ad:"Utarit",mod:"Merkür",sym:"☿",no:5,gun:"Çarşamba",renk:"Turkuaz, açık mavi, yeşil",renkHex:"#3aa6b9",tas:"Zümrüt ve akik",kw:"Zekâ · Söz · Ticaret",char:"Yıldızın Utarit, yani Merkür. Zekân hızlı, dilin akıcı, öğrenmen çabuktur. Kelimelerle, fikirlerle, alışverişle aran iyidir; bir konuyu kavrayıp başkasına anlatmak senin doğal yeteneğin. Meraklı ve çok yönlüsün, tek bir işe sığmazsın; elin de dilin de pratiktir.",kader:"Kaderin bilgi ve iletişim yollarından geçer: yazı, sözleşme, ticaret, öğretmenlik, aracılık… Söz söyleyeceğin, bağ kuracağın, alıp satacağın yerlerde şansın açıktır. Doğru bilgiyi doğru zamanda söylemek sana kapılar açar; kalemin ve dilin kaderinin anahtarıdır.",ogut:"Zihnin çok hızlı çalışıyor; bazen dur ve başladığın işi bitir. Her yöne koşarsan gücün de dağılır — bir kanala aktığında nehir olursun."},zuhre:{ad:"Zühre",mod:"Venüs",sym:"♀",no:6,gun:"Cuma",renk:"Yeşil, pembe, pastel tonlar",renkHex:"#4CAF7D",tas:"Zümrüt ve pembe kuvars",kw:"Sevgi · Güzellik · Uyum",char:"Yıldızın Zühre, yani Venüs. Sevgi, güzellik ve uyum senin doğanda. Estetik bir gözün, insanları yumuşatan bir çekimin var; sanat, zarafet ve ilişkiler senin alanın. Kavgadan değil, uzlaşmadan güç alırsın; girdiğin ortama incelik ve huzur taşırsın.",kader:"Kaderin sevgi ve ortaklıklar üzerinden şekillenir. Güzel şeyler seni bulur, insanlar sana iyilik yapmak ister; çoğu kapı senin için sevgiyle açılır. Bir işi tek başına zorlamaktan çok, doğru kişiyle el ele vererek büyürsün. Aşk, dostluk ve ortaklık kaderinin taşıyıcı sütunudur.",ogut:'Herkesi memnun etme derdi seni yorabilir; kendi değerini başkasının onayına bağlama. "Hayır" demeyi öğrendiğinde sevgin daha da kıymetlenir.'},merih:{ad:"Merih",mod:"Mars",sym:"♂",no:9,gun:"Salı",renk:"Kırmızı, kızıl, bordo",renkHex:"#c0392b",tas:"Yakut ve kızıl akik",kw:"Cesaret · Enerji · Mücadele",char:"Yıldızın Merih, yani Mars. İçinde güçlü bir enerji, cesaret ve mücadele gücü var. Harekete geçmekten korkmazsın; engel gördüğünde geri çekilmez, üstüne gidersin. Açık sözlü, atılgan ve korunmacısın — haksızlığa tahammülün yoktur, sevdiğin için savaşırsın.",kader:"Kaderin mücadeleyle ve cesaretle açılır. Rekabetin, sporun, girişimin, öncülüğün olduğu yerde parlarsın; kolay kazanılan değil, savaşarak kazanılan zaferler senindir. Hayat seni sık sık sınar ama her sınav seni güçlendirir — düştüğün yerden daha sert kalkarsın.",ogut:"Öfken en büyük enerjin ama en büyük tuzağın; onu yıkmak için değil, kurmak için kullan. Sabretmeyi öğrenen bir Merih durdurulamaz."},musteri:{ad:"Müşteri",mod:"Jüpiter",sym:"♃",no:3,gun:"Perşembe",renk:"Lacivert, mor, sarı",renkHex:"#3f51b5",tas:"Safir ve lapis lazuli",kw:"Bereket · Adalet · Bilgelik",char:"Yıldızın Müşteri, yani Jüpiter. Geniş bir gönlün, güçlü bir adalet duygun ve bereketli bir enerjin var. İnsanlar sana akıl danışır; öğretmek, yol göstermek, büyütmek senin doğanda. İyimser ve hoşgörülüsün, bardağın dolu tarafını görürsün; bulunduğun yere bolluk ve güven getirirsin.",kader:"Kaderin genişleme ve bereket üzerine kuruludur. Doğru niyetle attığın adım büyür, bollukla geri döner; darlıkta bile bir kapı sana açılır. Bilgi, inanç, hukuk, eğitim ve yurt dışıyla bağlı yollarda şansın yüksektir. Cömertliğin sana daha çoğu olarak geri gelir.",ogut:'Cömertliğin güzel ama sınırını bil; her yükü sen taşıyamazsın. "Her şeyi ben bilirim" demek büyümeni durdurur — öğrenmeye açık kaldıkça bilgeleşirsin.'},zuhal:{ad:"Zühal",mod:"Satürn",sym:"♄",no:8,gun:"Cumartesi",renk:"Koyu gri, siyah, lacivert",renkHex:"#4a4a55",tas:"Oniks ve hematit",kw:"Sabır · Disiplin · Dayanıklılık",char:"Yıldızın Zühal, yani Satürn. Sabırlı, disiplinli, ciddi ve dayanıklısın. Kolay yoldan değil, emekle ve zamanla kazanırsın; sözünün eri, güvenilir, ayakları yere basan bir yapın var. Belki gençken yaşından olgun görünürsün — hayat sana erken sorumluluk yükler ama bu seni sağlamlaştırır.",kader:"Kaderin yavaş ama sağlam ilerler. Başlangıçlar zorlu olabilir; emeğinin karşılığını hemen değil, zamanla ve katlanarak alırsın. Zühal geç ama kalıcı ödüllendirir: yaşın ilerledikçe güçlenir, kök saldıkça devrilmezsin. Sabrınla kurduğun her şey senden sonra da ayakta kalır.",ogut:"Kendine ve dünyaya fazla sert bakma; her şeyi tek başına taşımak zorunda değilsin. Sabrın kadar affetmeyi de öğren — o zaman yükün hafifler, yolun uzar."}},s4={sems:{sems:"ayna",kamer:"dost",merih:"dost",musteri:"dost",utarit:"notr",zuhre:"zorlu",zuhal:"zorlu"},kamer:{kamer:"ayna",sems:"dost",utarit:"dost",merih:"notr",musteri:"notr",zuhre:"notr",zuhal:"zorlu"},merih:{merih:"ayna",sems:"dost",kamer:"dost",musteri:"dost",zuhre:"notr",zuhal:"notr",utarit:"zorlu"},utarit:{utarit:"ayna",sems:"dost",zuhre:"dost",merih:"notr",musteri:"notr",zuhal:"notr",kamer:"zorlu"},musteri:{musteri:"ayna",sems:"dost",kamer:"dost",merih:"dost",zuhal:"notr",zuhre:"zorlu",utarit:"zorlu"},zuhre:{zuhre:"ayna",utarit:"dost",zuhal:"dost",merih:"notr",musteri:"notr",sems:"zorlu",kamer:"zorlu"},zuhal
