(function(){
  var DESC={"1": {"tr": "Koruma ve cesaretin başmeleği — korkma.", "en": "Archangel of protection and courage — do not fear.", "de": "Erzengel des Schutzes und Mutes — fürchte dich nicht.", "fr": "Archange de la protection et du courage — n’aie pas peur.", "es": "Arcángel de la protección y el valor — no temas.", "it": "Arcangelo della protezione e del coraggio — non temere.", "pt": "Arcanjo da proteção e da coragem — não temas.", "ru": "Архангел защиты и мужества — не бойся.", "ar": "رئيس ملائكة الحماية والشجاعة — لا تخف.", "zh": "守护与勇气的大天使——别害怕。", "ja": "守護と勇気の大天使——恐れないで。", "ko": "보호와 용기의 대천사 — 두려워 말라.", "hi": "सुरक्षा और साहस का महादूत — मत डरो।", "nl": "Aartsengel van bescherming en moed — wees niet bang.", "pl": "Archanioł ochrony i odwagi — nie lękaj się."}, "2": {"tr": "Korkuna rağmen o adımı at.", "en": "Take the step despite the fear.", "de": "Geh den Schritt trotz der Angst.", "fr": "Fais ce pas malgré la peur.", "es": "Da el paso a pesar del miedo.", "it": "Fai quel passo nonostante la paura.", "pt": "Dá o passo apesar do medo.", "ru": "Сделай шаг несмотря на страх.", "ar": "اخطُ الخطوة رغم الخوف.", "zh": "纵有恐惧，也迈出那一步。", "ja": "恐れがあっても一歩を踏み出そう。", "ko": "두려워도 그 한 걸음을 내딛어라.", "hi": "डर के बावजूद वह कदम उठाओ।", "nl": "Zet die stap ondanks de angst.", "pl": "Zrób ten krok mimo lęku."}, "3": {"tr": "Korunuyorsun; endişeyi bırak.", "en": "You are protected; release worry.", "de": "Du bist beschützt; lass die Sorge los.", "fr": "Tu es protégé ; laisse aller l’inquiétude.", "es": "Estás protegido; suelta la preocupación.", "it": "Sei protetto; lascia andare la preoccupazione.", "pt": "Estás protegido; solta a preocupação.", "ru": "Ты под защитой; отпусти тревогу.", "ar": "أنت محميّ؛ اترك القلق.", "zh": "你被守护着；放下忧虑。", "ja": "あなたは守られている；不安を手放して。", "ko": "너는 보호받고 있다; 걱정을 놓아라.", "hi": "तुम सुरक्षित हो; चिंता छोड़ दो।", "nl": "Je wordt beschermd; laat de zorg los.", "pl": "Jesteś chroniony; puść zmartwienie."}, "4": {"tr": "Bekleme bitti; harekete geç.", "en": "The waiting is over; move now.", "de": "Das Warten ist vorbei; handle jetzt.", "fr": "L’attente est finie ; agis maintenant.", "es": "La espera terminó; actúa ahora.", "it": "L’attesa è finita; agisci ora.", "pt": "A espera acabou; age agora.", "ru": "Ожидание окончено; действуй сейчас.", "ar": "انتهى الانتظار؛ تحرّك الآن.", "zh": "等待已结束；现在就行动。", "ja": "待つ時は終わった；今動こう。", "ko": "기다림은 끝났다; 지금 움직여라.", "hi": "प्रतीक्षा समाप्त हुई; अभी कदम बढ़ाओ।", "nl": "Het wachten is voorbij; kom nu in beweging.", "pl": "Czekanie się skończyło; działaj teraz."}, "5": {"tr": "Nazikçe 'hayır' demeyi öğren.", "en": "Learn to say a gentle 'no'.", "de": "Lerne, sanft „Nein“ zu sagen.", "fr": "Apprends à dire un « non » doux.", "es": "Aprende a decir un «no» amable.", "it": "Impara a dire un «no» gentile.", "pt": "Aprende a dizer um «não» gentil.", "ru": "Научись мягко говорить «нет».", "ar": "تعلّم أن تقول «لا» بلطف.", "zh": "学会温和地说「不」。", "ja": "やさしく「ノー」と言うことを学ぼう。", "ko": "부드럽게 ‘아니’라고 말하는 법을 배워라.", "hi": "कोमलता से ‘ना’ कहना सीखो।", "nl": "Leer een zacht „nee“ te zeggen.", "pl": "Naucz się mówić łagodne „nie“."}, "6": {"tr": "Değerin onaya bağlı değil; kendine güven.", "en": "Your worth needs no approval; trust yourself.", "de": "Dein Wert braucht keine Zustimmung; vertraue dir.", "fr": "Ta valeur n’a besoin d’aucune approbation ; aie confiance en toi.", "es": "Tu valor no necesita aprobación; confía en ti.", "it": "Il tuo valore non ha bisogno di approvazione; fidati di te.", "pt": "O teu valor não precisa de aprovação; confia em ti.", "ru": "Твоя ценность не нуждается в одобрении; доверься себе.", "ar": "قيمتك لا تحتاج موافقة؛ ثِق بنفسك.", "zh": "你的价值无需认可；相信自己。", "ja": "あなたの価値に承認はいらない；自分を信じて。", "ko": "네 가치는 인정이 필요 없다; 너를 믿어라.", "hi": "तुम्हारे मूल्य को स्वीकृति नहीं चाहिए; खुद पर भरोसा करो।", "nl": "Je waarde heeft geen goedkeuring nodig; vertrouw op jezelf.", "pl": "Twoja wartość nie potrzebuje aprobaty; zaufaj sobie."}, "7": {"tr": "Kalbini yakanın peşinden git.", "en": "Follow what sets your heart alight.", "de": "Folge dem, was dein Herz entflammt.", "fr": "Suis ce qui enflamme ton cœur.", "es": "Sigue lo que enciende tu corazón.", "it": "Segui ciò che accende il tuo cuore.", "pt": "Segue o que acende o teu coração.", "ru": "Следуй за тем, что зажигает твоё сердце.", "ar": "اتبع ما يُشعل قلبك.", "zh": "追随点燃你内心的事物。", "ja": "心を燃やすものに従おう。", "ko": "네 마음을 불태우는 것을 따르라.", "hi": "जो तुम्हारे हृदय को प्रज्वलित करे, उसका अनुसरण करो।", "nl": "Volg wat je hart doet ontvlammen.", "pl": "Podążaj za tym, co rozpala twoje serce."}, "8": {"tr": "Öne çık, yön ver, ilham ol.", "en": "Step up, guide, inspire.", "de": "Tritt hervor, führe, inspiriere.", "fr": "Avance, guide, inspire.", "es": "Da un paso al frente, guía, inspira.", "it": "Fatti avanti, guida, ispira.", "pt": "Avança, orienta, inspira.", "ru": "Выйди вперёд, веди, вдохновляй.", "ar": "تقدّم، وجِّه، ألهِم.", "zh": "挺身而出，引领，启发。", "ja": "前に出て、導き、鼓舞しよう。", "ko": "앞으로 나서고, 이끌고, 영감을 주어라.", "hi": "आगे आओ, मार्ग दिखाओ, प्रेरित करो।", "nl": "Kom naar voren, leid, inspireer.", "pl": "Wystąp naprzód, prowadź, inspiruj."}, "9": {"tr": "Eski, ağır enerjiyi bırak; hafifle.", "en": "Release the old, heavy energy; feel lighter.", "de": "Lass die alte, schwere Energie los; werde leichter.", "fr": "Libère l’ancienne énergie lourde ; allège-toi.", "es": "Libera la vieja energía pesada; siéntete más ligero.", "it": "Libera la vecchia energia pesante; alleggerisciti.", "pt": "Liberta a velha energia pesada; fica mais leve.", "ru": "Отпусти старую тяжёлую энергию; стань легче.", "ar": "حرّر الطاقة القديمة الثقيلة؛ خِفّ.", "zh": "释放沉重的旧能量；让自己轻盈。", "ja": "古く重いエネルギーを手放し、軽くなろう。", "ko": "낡고 무거운 에너지를 놓아 가벼워져라.", "hi": "पुरानी भारी ऊर्जा को छोड़ो; हल्के हो जाओ।", "nl": "Laat de oude, zware energie los; word lichter.", "pl": "Uwolnij starą, ciężką energię; stań się lżejszy."}, "10": {"tr": "Kararında dur, vazgeçme.", "en": "Hold your ground; do not give up.", "de": "Bleib standhaft; gib nicht auf.", "fr": "Tiens bon ; n’abandonne pas.", "es": "Mantente firme; no te rindas.", "it": "Tieni duro; non arrenderti.", "pt": "Mantém-te firme; não desistas.", "ru": "Стой на своём; не сдавайся.", "ar": "اثبت على موقفك؛ لا تستسلم.", "zh": "坚守立场；别放弃。", "ja": "踏みとどまろう；あきらめないで。", "ko": "네 자리를 지켜라; 포기하지 마라.", "hi": "अपनी जगह पर डटे रहो; हार मत मानो।", "nl": "Houd stand; geef niet op.", "pl": "Trwaj przy swoim; nie poddawaj się."}, "11": {"tr": "Bir dönem kapanır, yenisi doğar.", "en": "One chapter closes, a new one is born.", "de": "Ein Kapitel endet, ein neues beginnt.", "fr": "Un chapitre se ferme, un autre naît.", "es": "Un capítulo se cierra, otro nace.", "it": "Un capitolo si chiude, uno nuovo nasce.", "pt": "Um capítulo se fecha, outro nasce.", "ru": "Одна глава закрывается, рождается новая.", "ar": "فصل ينتهي، وآخر يولد.", "zh": "一章落幕，新篇诞生。", "ja": "ひとつの章が閉じ、新たな章が生まれる。", "ko": "한 장이 닫히고, 새 장이 열린다.", "hi": "एक अध्याय बंद होता है, नया जन्म लेता है।", "nl": "Eén hoofdstuk sluit, een nieuw wordt geboren.", "pl": "Jeden rozdział się zamyka, rodzi się nowy."}, "12": {"tr": "Müjde ve sezginin başmeleği.", "en": "Archangel of good news and intuition.", "de": "Erzengel der guten Nachricht und Intuition.", "fr": "Archange des bonnes nouvelles et de l’intuition.", "es": "Arcángel de las buenas noticias y la intuición.", "it": "Arcangelo delle buone notizie e dell’intuizione.", "pt": "Arcanjo das boas notícias e da intuição.", "ru": "Архангел добрых вестей и интуиции.", "ar": "رئيس ملائكة البشرى والحدس.", "zh": "喜讯与直觉的大天使。", "ja": "吉報と直感の大天使。", "ko": "기쁜 소식과 직관의 대천사.", "hi": "शुभ समाचार और अंतर्ज्ञान का महादूत।", "nl": "Aartsengel van goed nieuws en intuïtie.", "pl": "Archanioł dobrych wieści i intuicji."}, "13": {"tr": "Kalbini aç; vermeye ve almaya izin ver.", "en": "Open your heart; allow giving and receiving.", "de": "Öffne dein Herz; erlaube Geben und Nehmen.", "fr": "Ouvre ton cœur ; permets de donner et de recevoir.", "es": "Abre tu corazón; permite dar y recibir.", "it": "Apri il cuore; permetti di dare e ricevere.", "pt": "Abre o teu coração; permite dar e receber.", "ru": "Открой сердце; позволь давать и принимать.", "ar": "افتح قلبك؛ اسمح بالعطاء والأخذ.", "zh": "敞开心扉；允许给予与接受。", "ja": "心を開こう；与えることと受け取ることを許して。", "ko": "마음을 열어라; 주고받음을 허락하라.", "hi": "अपना हृदय खोलो; देना और लेना स्वीकार करो।", "nl": "Open je hart; sta geven en ontvangen toe.", "pl": "Otwórz serce; pozwól dawać i przyjmować."}, "14": {"tr": "İç sesin haklı; onu dinle.", "en": "Your inner voice is right; listen.", "de": "Deine innere Stimme hat recht; höre zu.", "fr": "Ta voix intérieure a raison ; écoute-la.", "es": "Tu voz interior tiene razón; escúchala.", "it": "La tua voce interiore ha ragione; ascoltala.", "pt": "A tua voz interior tem razão; escuta-a.", "ru": "Твой внутренний голос прав; прислушайся.", "ar": "صوتك الداخلي محقّ؛ أنصت إليه.", "zh": "你的内在声音是对的；聆听它。", "ja": "内なる声は正しい；耳を傾けて。", "ko": "네 내면의 목소리가 옳다; 귀 기울여라.", "hi": "तुम्हारी भीतरी आवाज़ सही है; उसे सुनो।", "nl": "Je innerlijke stem heeft gelijk; luister.", "pl": "Twój wewnętrzny głos ma rację; posłuchaj go."}, "15": {"tr": "Hislerini bastırma, nazikçe kabul et.", "en": "Don't suppress your feelings; accept them gently.", "de": "Unterdrücke deine Gefühle nicht; nimm sie sanft an.", "fr": "Ne réprime pas tes émotions ; accueille-les avec douceur.", "es": "No reprimas tus sentimientos; acéptalos con dulzura.", "it": "Non reprimere i tuoi sentimenti; accoglili con dolcezza.", "pt": "Não reprimas os teus sentimentos; acolhe-os com doçura.", "ru": "Не подавляй чувства; прими их мягко.", "ar": "لا تكبت مشاعرك؛ تقبّلها بلطف.", "zh": "别压抑情绪；温柔地接纳它们。", "ja": "感情を抑えないで；やさしく受け入れよう。", "ko": "감정을 억누르지 말고 부드럽게 받아들여라.", "hi": "भावनाओं को दबाओ मत; उन्हें कोमलता से स्वीकारो।", "nl": "Onderdruk je gevoelens niet; aanvaard ze zacht.", "pl": "Nie tłum uczuć; przyjmij je łagodnie."}, "16": {"tr": "Kendine sevdiğin biri gibi davran.", "en": "Treat yourself as someone you love.", "de": "Behandle dich wie jemanden, den du liebst.", "fr": "Traite-toi comme quelqu’un que tu aimes.", "es": "Trátate como a alguien que amas.", "it": "Trattati come qualcuno che ami.", "pt": "Trata-te como alguém que amas.", "ru": "Относись к себе как к тому, кого любишь.", "ar": "عامل نفسك كمن تحب.", "zh": "像对待所爱之人一样对待自己。", "ja": "愛する人のように自分を扱おう。", "ko": "사랑하는 이를 대하듯 너를 대하라.", "hi": "खुद से वैसा बर्ताव करो जैसे किसी प्रिय से।", "nl": "Behandel jezelf als iemand van wie je houdt.", "pl": "Traktuj siebie jak kogoś, kogo kochasz."}, "17": {"tr": "Affet ve yükü indir; bu seni özgürleştirir.", "en": "Forgive and set down the weight; it frees you.", "de": "Vergib und leg die Last ab; es befreit dich.", "fr": "Pardonne et dépose le fardeau ; cela te libère.", "es": "Perdona y suelta el peso; eso te libera.", "it": "Perdona e posa il peso; ti libera.", "pt": "Perdoa e pousa o peso; isso te liberta.", "ru": "Прости и сложи груз; это освобождает.", "ar": "اغفر وضع الحمل؛ هذا يحرّرك.", "zh": "宽恕并放下重担；这会让你自由。", "ja": "許して重荷を下ろそう；それが自由にする。", "ko": "용서하고 짐을 내려놓아라; 그것이 너를 자유롭게 한다.", "hi": "क्षमा करो और बोझ उतारो; यह तुम्हें मुक्त करता है।", "nl": "Vergeef en leg de last neer; het bevrijdt je.", "pl": "Wybacz i odłóż ciężar; to cię wyzwala."}, "18": {"tr": "Kontrolü bırak; akışa güven.", "en": "Let go of control; trust the flow.", "de": "Lass die Kontrolle los; vertraue dem Fluss.", "fr": "Lâche le contrôle ; fais confiance au courant.", "es": "Suelta el control; confía en el fluir.", "it": "Lascia il controllo; fidati del flusso.", "pt": "Solta o controlo; confia no fluxo.", "ru": "Отпусти контроль; доверься потоку.", "ar": "اترك السيطرة؛ ثِق بالتدفق.", "zh": "放下掌控；信任流动。", "ja": "コントロールを手放し、流れを信じて。", "ko": "통제를 놓고 흐름을 믿어라.", "hi": "नियंत्रण छोड़ो; प्रवाह पर भरोसा करो।", "nl": "Laat de controle los; vertrouw op de stroom.", "pl": "Puść kontrolę; zaufaj nurtowi."}, "19": {"tr": "İşaretlere ve rüyalarına dikkat et.", "en": "Watch the signs and your dreams.", "de": "Achte auf die Zeichen und deine Träume.", "fr": "Observe les signes et tes rêves.", "es": "Presta atención a las señales y a tus sueños.", "it": "Osserva i segni e i tuoi sogni.", "pt": "Observa os sinais e os teus sonhos.", "ru": "Замечай знаки и свои сны.", "ar": "راقب الإشارات وأحلامك.", "zh": "留意征兆与你的梦境。", "ja": "しるしと夢に目を向けて。", "ko": "징표와 네 꿈을 살펴라.", "hi": "संकेतों और अपने सपनों पर ध्यान दो।", "nl": "Let op de tekenen en je dromen.", "pl": "Zwracaj uwagę na znaki i swoje sny."}, "20": {"tr": "Gürültüyü kıs, içeriyi dinle.", "en": "Lower the noise; listen within.", "de": "Dämpfe den Lärm; höre nach innen.", "fr": "Baisse le bruit ; écoute au-dedans.", "es": "Baja el ruido; escucha en tu interior.", "it": "Abbassa il rumore; ascolta dentro di te.", "pt": "Baixa o ruído; escuta por dentro.", "ru": "Убавь шум; слушай внутри.", "ar": "اخفض الضجيج؛ أنصت إلى الداخل.", "zh": "调低喧嚣；向内聆听。", "ja": "雑音を下げ、内側に耳を澄まそう。", "ko": "소음을 줄이고 안을 들어라.", "hi": "शोर कम करो; भीतर सुनो।", "nl": "Zet het lawaai zachter; luister vanbinnen.", "pl": "Ścisz hałas; słuchaj wewnątrz."}, "21": {"tr": "Eski bir yara kapanıyor; iyileş.", "en": "An old wound is closing; heal.", "de": "Eine alte Wunde schließt sich; heile.", "fr": "Une vieille blessure se referme ; guéris.", "es": "Una vieja herida se cierra; sana.", "it": "Una vecchia ferita si chiude; guarisci.", "pt": "Uma velha ferida se fecha; cura-te.", "ru": "Старая рана затягивается; исцеляйся.", "ar": "جرح قديم يلتئم؛ تعافَ.", "zh": "旧伤正在愈合；疗愈自己。", "ja": "古い傷が閉じていく；癒えよう。", "ko": "오래된 상처가 아문다; 치유되어라.", "hi": "एक पुराना घाव भर रहा है; चंगे हो जाओ।", "nl": "Een oude wond sluit zich; genees.", "pl": "Stara rana się zamyka; ulecz się."}, "22": {"tr": "Bir bağ derinleşiyor; sevgiyle yaklaş.", "en": "A bond deepens; approach with love.", "de": "Eine Bindung vertieft sich; begegne ihr mit Liebe.", "fr": "Un lien s’approfondit ; approche avec amour.", "es": "Un vínculo se profundiza; acércate con amor.", "it": "Un legame si approfondisce; avvicìnati con amore.", "pt": "Um vínculo se aprofunda; aproxima-te com amor.", "ru": "Связь углубляется; подойди с любовью.", "ar": "رابطة تتعمّق؛ اقترب بالحب.", "zh": "一段联结在加深；以爱靠近。", "ja": "絆が深まる；愛をもって近づいて。", "ko": "인연이 깊어진다; 사랑으로 다가가라.", "hi": "एक बंधन गहरा हो रहा है; प्रेम से पास आओ।", "nl": "Een band verdiept; nader met liefde.", "pl": "Więź się pogłębia; zbliż się z miłością."}, "23": {"tr": "Şifanın başmeleği — iyileşeceksin.", "en": "Archangel of healing — you will heal.", "de": "Erzengel der Heilung — du wirst heilen.", "fr": "Archange de la guérison — tu guériras.", "es": "Arcángel de la sanación — sanarás.", "it": "Arcangelo della guarigione — guarirai.", "pt": "Arcanjo da cura — vais curar-te.", "ru": "Архангел исцеления — ты исцелишься.", "ar": "رئيس ملائكة الشفاء — ستُشفى.", "zh": "疗愈的大天使——你会痊愈。", "ja": "癒しの大天使——あなたは癒える。", "ko": "치유의 대천사 — 너는 나을 것이다.", "hi": "उपचार का महादूत — तुम स्वस्थ हो जाओगे।", "nl": "Aartsengel van genezing — je zult genezen.", "pl": "Archanioł uzdrowienia — wyzdrowiejesz."}, "24": {"tr": "İyileşme başladı; kendine iyi bak.", "en": "Healing has begun; take good care.", "de": "Die Heilung hat begonnen; sorge gut für dich.", "fr": "La guérison a commencé ; prends bien soin de toi.", "es": "La sanación ha comenzado; cuídate bien.", "it": "La guarigione è iniziata; abbi cura di te.", "pt": "A cura começou; cuida bem de ti.", "ru": "Исцеление началось; береги себя.", "ar": "بدأ الشفاء؛ اعتنِ بنفسك جيدًا.", "zh": "疗愈已开始；好好照顾自己。", "ja": "癒しは始まった；自分を大切に。", "ko": "치유가 시작되었다; 너를 잘 돌보아라.", "hi": "उपचार शुरू हो चुका है; अपना ख्याल रखो।", "nl": "De genezing is begonnen; zorg goed voor jezelf.", "pl": "Uzdrowienie się zaczęło; dbaj o siebie."}, "25": {"tr": "Sis dağılıyor; cevap netleşecek.", "en": "The fog lifts; the answer will become clear.", "de": "Der Nebel lichtet sich; die Antwort wird klar.", "fr": "Le brouillard se lève ; la réponse s’éclaircira.", "es": "La niebla se disipa; la respuesta se aclarará.", "it": "La nebbia si dirada; la risposta diventerà chiara.", "pt": "A névoa se dissipa; a resposta ficará clara.", "ru": "Туман рассеивается; ответ прояснится.", "ar": "ينقشع الضباب؛ سيتّضح الجواب.", "zh": "迷雾散去；答案将变清晰。", "ja": "霧が晴れ、答えは明らかになる。", "ko": "안개가 걷힌다; 답이 분명해질 것이다.", "hi": "कोहरा छँट रहा है; उत्तर स्पष्ट होगा।", "nl": "De mist trekt op; het antwoord wordt helder.", "pl": "Mgła się podnosi; odpowiedź się rozjaśni."}, "26": {"tr": "Konuş, ifade et, sustuğunu söyle.", "en": "Speak, express, say what you've held back.", "de": "Sprich, drücke aus, sag, was du zurückhieltst.", "fr": "Parle, exprime, dis ce que tu as retenu.", "es": "Habla, exprésate, di lo que callaste.", "it": "Parla, esprimi, di’ ciò che hai trattenuto.", "pt": "Fala, expressa, diz o que guardaste.", "ru": "Говори, выражай, скажи то, что сдерживал.", "ar": "تكلّم، عبّر، قل ما كتمته.", "zh": "说出来，表达，讲出你憋住的话。", "ja": "話し、表現し、こらえていたことを言おう。", "ko": "말하고, 표현하고, 참았던 것을 말하라.", "hi": "बोलो, व्यक्त करो, जो रोका था वह कहो।", "nl": "Spreek, uit je, zeg wat je hebt ingehouden.", "pl": "Mów, wyrażaj, powiedz to, co zatrzymałeś."}, "27": {"tr": "Gerçeği gör ve dürüst ol.", "en": "See the truth and be honest.", "de": "Sieh die Wahrheit und sei ehrlich.", "fr": "Vois la vérité et sois honnête.", "es": "Ve la verdad y sé honesto.", "it": "Vedi la verità e sii onesto.", "pt": "Vê a verdade e sê honesto.", "ru": "Увидь правду и будь честен.", "ar": "أبصر الحقيقة وكن صادقًا.", "zh": "看清真相，保持诚实。", "ja": "真実を見て、正直でいよう。", "ko": "진실을 보고 정직하라.", "hi": "सच्चाई देखो और ईमानदार रहो।", "nl": "Zie de waarheid en wees eerlijk.", "pl": "Zobacz prawdę i bądź szczery."}, "28": {"tr": "Bir fikir kapını çalıyor; yakala.", "en": "An idea is knocking; catch it.", "de": "Eine Idee klopft an; ergreife sie.", "fr": "Une idée frappe à ta porte ; saisis-la.", "es": "Una idea llama a tu puerta; atrápala.", "it": "Un’idea bussa; afferrala.", "pt": "Uma ideia bate à porta; agarra-a.", "ru": "Идея стучится; поймай её.", "ar": "فكرة تطرق الباب؛ التقطها.", "zh": "一个念头在敲门；抓住它。", "ja": "ひらめきが扉を叩く；つかまえて。", "ko": "아이디어가 문을 두드린다; 붙잡아라.", "hi": "एक विचार दस्तक दे रहा है; उसे थाम लो।", "nl": "Een idee klopt aan; grijp het.", "pl": "Pomysł puka; złap go."}, "29": {"tr": "Aşırı düşünmeyi bırak; bir nefes al.", "en": "Stop overthinking; take a breath.", "de": "Hör auf zu grübeln; atme durch.", "fr": "Cesse de trop réfléchir ; respire.", "es": "Deja de pensar de más; respira.", "it": "Smetti di rimuginare; fai un respiro.", "pt": "Para de pensar demais; respira.", "ru": "Перестань переусердствовать в мыслях; вдохни.", "ar": "توقّف عن الإفراط في التفكير؛ خذ نفسًا.", "zh": "别再过度思虑；深呼吸。", "ja": "考えすぎをやめ、ひと息つこう。", "ko": "지나친 생각을 멈추고 숨을 쉬어라.", "hi": "अधिक सोचना बंद करो; एक साँस लो।", "nl": "Stop met piekeren; haal adem.", "pl": "Przestań rozmyślać; weź oddech."}, "30": {"tr": "Öğrenmeye açık ol; yol gösterilecek.", "en": "Stay open to learning; you'll be guided.", "de": "Bleib offen zu lernen; du wirst geführt.", "fr": "Reste ouvert à apprendre ; tu seras guidé.", "es": "Mantente abierto a aprender; serás guiado.", "it": "Resta aperto ad imparare; sarai guidato.", "pt": "Mantém-te aberto a aprender; serás guiado.", "ru": "Будь открыт учению; тебя направят.", "ar": "ابقَ منفتحًا على التعلّم؛ ستُرشَد.", "zh": "对学习保持开放；你会被指引。", "ja": "学びに開かれていよう；導かれる。", "ko": "배움에 열려 있어라; 인도받을 것이다.", "hi": "सीखने के लिए खुले रहो; तुम्हें मार्ग मिलेगा।", "nl": "Blijf open om te leren; je wordt geleid.", "pl": "Bądź otwarty na naukę; zostaniesz poprowadzony."}, "31": {"tr": "Soruna başka pencereden bak.", "en": "Look at the problem from another window.", "de": "Betrachte das Problem aus einem anderen Fenster.", "fr": "Regarde le problème par une autre fenêtre.", "es": "Mira el problema desde otra ventana.", "it": "Guarda il problema da un’altra finestra.", "pt": "Olha o problema por outra janela.", "ru": "Взгляни на проблему из другого окна.", "ar": "انظر إلى المشكلة من نافذة أخرى.", "zh": "从另一扇窗看待问题。", "ja": "別の窓から問題を見てみよう。", "ko": "다른 창으로 문제를 바라보라.", "hi": "समस्या को किसी दूसरी खिड़की से देखो।", "nl": "Bekijk het probleem door een ander venster.", "pl": "Spójrz na problem z innego okna."}, "32": {"tr": "Seni sıkan kalıbı gevşet; kanatlan.", "en": "Loosen what confines you; take wing.", "de": "Löse, was dich einengt; erhebe dich.", "fr": "Desserre ce qui t’enferme ; prends ton envol.", "es": "Afloja lo que te limita; alza el vuelo.", "it": "Allenta ciò che ti costringe; spicca il volo.", "pt": "Solta o que te aperta; alça voo.", "ru": "Ослабь то, что сковывает; расправь крылья.", "ar": "حِلّ ما يقيّدك؛ حلّق.", "zh": "松开束缚你的；展翅飞翔。", "ja": "縛るものをゆるめ、翼を広げよう。", "ko": "너를 옭아매는 것을 풀고 날아올라라.", "hi": "जो तुम्हें बाँधता है उसे ढीला करो; उड़ान भरो।", "nl": "Maak los wat je beknelt; neem de vlucht.", "pl": "Poluzuj to, co cię krępuje; wzbij się."}, "33": {"tr": "Endişeni bırak; bugüne dön, nefes al.", "en": "Let go of worry; return to today, breathe.", "de": "Lass die Sorge los; kehr ins Heute zurück, atme.", "fr": "Laisse l’inquiétude ; reviens à aujourd’hui, respire.", "es": "Suelta la preocupación; vuelve al hoy, respira.", "it": "Lascia la preoccupazione; torna all’oggi, respira.", "pt": "Solta a preocupação; volta ao hoje, respira.", "ru": "Отпусти тревогу; вернись в сегодня, дыши.", "ar": "اترك القلق؛ عُد إلى اليوم، وتنفّس.", "zh": "放下忧虑；回到今天，呼吸。", "ja": "不安を手放し、今日に戻って、呼吸しよう。", "ko": "걱정을 놓고 오늘로 돌아와 숨을 쉬어라.", "hi": "चिंता छोड़ो; आज में लौटो, साँस लो।", "nl": "Laat de zorg los; keer terug naar vandaag, adem.", "pl": "Puść zmartwienie; wróć do dziś, oddychaj."}, "34": {"tr": "Bilgelik ve istikrarın başmeleği.", "en": "Archangel of wisdom and stability.", "de": "Erzengel der Weisheit und Beständigkeit.", "fr": "Archange de la sagesse et de la stabilité.", "es": "Arcángel de la sabiduría y la estabilidad.", "it": "Arcangelo della saggezza e della stabilità.", "pt": "Arcanjo da sabedoria e da estabilidade.", "ru": "Архангел мудрости и устойчивости.", "ar": "رئيس ملائكة الحكمة والثبات.", "zh": "智慧与稳定的大天使。", "ja": "叡智と安定の大天使。", "ko": "지혜와 안정의 대천사.", "hi": "ज्ञान और स्थिरता का महादूत।", "nl": "Aartsengel van wijsheid en standvastigheid.", "pl": "Archanioł mądrości i stabilności."}, "35": {"tr": "Bolluk akıyor; kıtlık korkusunu bırak.", "en": "Abundance flows; release the fear of lack.", "de": "Fülle fließt; lass die Angst vor Mangel los.", "fr": "L’abondance coule ; libère la peur du manque.", "es": "La abundancia fluye; suelta el miedo a la carencia.", "it": "L’abbondanza scorre; lascia la paura della mancanza.", "pt": "A abundância flui; solta o medo da falta.", "ru": "Изобилие течёт; отпусти страх нехватки.", "ar": "الوفرة تتدفق؛ اترك الخوف من النقص.", "zh": "丰盛在流动；放下匮乏的恐惧。", "ja": "豊かさが流れる；欠乏の恐れを手放して。", "ko": "풍요가 흐른다; 결핍의 두려움을 놓아라.", "hi": "समृद्धि बह रही है; अभाव का भय छोड़ो।", "nl": "Overvloed stroomt; laat de angst voor gebrek los.", "pl": "Obfitość płynie; puść lęk przed niedostatkiem."}, "36": {"tr": "Şans kapıları aralanıyor; 'evet' de.", "en": "Doors of luck are opening; say 'yes'.", "de": "Türen des Glücks öffnen sich; sag „Ja“.", "fr": "Les portes de la chance s’ouvrent ; dis « oui ».", "es": "Las puertas de la suerte se abren; di «sí».", "it": "Le porte della fortuna si aprono; di’ «sì».", "pt": "As portas da sorte se abrem; diz «sim».", "ru": "Двери удачи открываются; скажи «да».", "ar": "أبواب الحظ تُفتح؛ قل «نعم».", "zh": "幸运之门开启；说「好」。", "ja": "幸運の扉が開く；「はい」と言おう。", "ko": "행운의 문이 열린다; ‘예’라고 말하라.", "hi": "भाग्य के द्वार खुल रहे हैं; ‘हाँ’ कहो।", "nl": "Deuren van geluk gaan open; zeg „ja“.", "pl": "Drzwi szczęścia się otwierają; powiedz „tak“."}, "37": {"tr": "Acele etme; her şey zamanında.", "en": "Don't rush; all in its right time.", "de": "Überstürze nichts; alles zu seiner Zeit.", "fr": "Ne te presse pas ; chaque chose en son temps.", "es": "No te apresures; todo a su tiempo.", "it": "Non avere fretta; ogni cosa a suo tempo.", "pt": "Não te apresses; tudo a seu tempo.", "ru": "Не спеши; всё в своё время.", "ar": "لا تتعجّل؛ كل شيء في وقته.", "zh": "别急；一切自有其时。", "ja": "急がないで；すべては時が来れば。", "ko": "서두르지 마라; 모든 것은 때가 있다.", "hi": "जल्दी मत करो; हर चीज़ अपने समय पर।", "nl": "Haast je niet; alles op zijn tijd.", "pl": "Nie spiesz się; wszystko w swoim czasie."}, "38": {"tr": "Yavaş ama sağlam inşa et.", "en": "Build slowly but solidly.", "de": "Baue langsam, aber solide.", "fr": "Construis lentement mais solidement.", "es": "Construye despacio pero con solidez.", "it": "Costruisci lentamente ma solidamente.", "pt": "Constrói devagar, mas com solidez.", "ru": "Строй медленно, но прочно.", "ar": "ابنِ ببطء لكن بمتانة.", "zh": "缓慢却扎实地建造。", "ja": "ゆっくり、しかし堅実に築こう。", "ko": "천천히, 그러나 단단히 세워라.", "hi": "धीरे पर मज़बूती से बनाओ।", "nl": "Bouw langzaam maar stevig.", "pl": "Buduj powoli, lecz solidnie."}, "39": {"tr": "Bedenine kulak ver; dinlen, beslen.", "en": "Listen to your body; rest and nourish.", "de": "Höre auf deinen Körper; ruhe und nähre dich.", "fr": "Écoute ton corps ; repose-toi et nourris-toi.", "es": "Escucha a tu cuerpo; descansa y nútrete.", "it": "Ascolta il tuo corpo; riposa e nutriti.", "pt": "Escuta o teu corpo; descansa e nutre-te.", "ru": "Прислушайся к телу; отдыхай и питайся.", "ar": "أنصت إلى جسدك؛ استرِح وتغذَّ.", "zh": "聆听身体；休息与滋养。", "ja": "体の声を聞き、休み、養おう。", "ko": "네 몸에 귀 기울여 쉬고 채워라.", "hi": "अपने शरीर को सुनो; विश्राम करो और पोषण दो।", "nl": "Luister naar je lichaam; rust en voed je.", "pl": "Słuchaj swojego ciała; odpoczywaj i odżywiaj się."}, "40": {"tr": "Sahip olduklarına şükret.", "en": "Give thanks for what you have.", "de": "Sei dankbar für das, was du hast.", "fr": "Sois reconnaissant pour ce que tu as.", "es": "Agradece lo que tienes.", "it": "Sii grato per ciò che hai.", "pt": "Agradece pelo que tens.", "ru": "Будь благодарен за то, что имеешь.", "ar": "اشكر على ما لديك.", "zh": "为你所拥有的心怀感恩。", "ja": "今あるものに感謝しよう。", "ko": "가진 것에 감사하라.", "hi": "जो तुम्हारे पास है उसके लिए आभारी बनो।", "nl": "Wees dankbaar voor wat je hebt.", "pl": "Bądź wdzięczny za to, co masz."}, "41": {"tr": "Ayaklarını yere bas; huzur şimdide.", "en": "Ground yourself; peace is in the present.", "de": "Erde dich; der Frieden ist im Jetzt.", "fr": "Ancre-toi ; la paix
