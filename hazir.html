  :root{--bg:#F7F3E8;--ink:#25181C;--muted:#9c8666;--line:rgba(37,24,28,.16);
    --disp:'Italiana',serif;--serif:'Cormorant Garamond',serif;--sans:'DM Sans',sans-serif;--vh:100vh;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  ::selection{background:#e7dcc4}
  #app{position:relative;overflow-y:auto;overflow-x:hidden;background:var(--bg);color:var(--ink);
    width:100%;max-width:640px;margin:0 auto;height:100vh;height:100dvh;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
  #app::-webkit-scrollbar{width:0}
  .sec{min-height:var(--vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 22px;position:relative}
  .rv{opacity:0;transform:translateY(26px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
  .rv.in{opacity:1;transform:none}
  .d1{transition-delay:.08s}.d2{transition-delay:.18s}.d3{transition-delay:.3s}.d4{transition-delay:.42s}
  .backlink{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:14px 16px;background:rgba(247,243,232,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .backlink a{font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none;opacity:.7}
  .brandmini{font-family:var(--disp);letter-spacing:.3em;font-size:14px;margin-left:auto;padding-right:.3em}
  .kicker{font-family:var(--sans);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  #gears,#gearsLoad{width:min(74vw,320px);aspect-ratio:1;margin:0 auto;position:relative}
  #gearsLoad{width:min(64vw,280px)}
  #gears canvas,#gearsLoad canvas{display:block}
  .tagline{font-family:var(--serif);font-style:italic;font-size:clamp(17px,4.8vw,24px);color:#5a4a44;margin-top:22px;max-width:88%}
  .continue{margin-top:30px;display:inline-flex;flex-direction:column;align-items:center;gap:9px;font-family:var(--sans);font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink);background:none;border:0;cursor:pointer}
  .continue span.ln{width:1px;height:34px;background:var(--ink);opacity:.55;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.25;transform:scaleY(.7)}50%{opacity:.7;transform:scaleY(1)}}
  h2.big{font-family:var(--disp);font-weight:400;line-height:1.05;font-size:clamp(30px,10vw,52px);text-transform:uppercase;letter-spacing:.03em;max-width:100%}
  .lead{font-family:var(--serif);font-style:italic;font-size:clamp(14px,3.7vw,19px);color:#5a4a44;max-width:92%;margin:16px auto 0;line-height:1.5}
  .num{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--muted);letter-spacing:.2em;margin-bottom:8px}
  .ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(360px,92%);margin:26px auto 0}
  .gcell{border:1px solid var(--line);border-radius:6px;padding:16px 12px;background:rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;gap:8px;min-height:104px;justify-content:center}
  .gcell .gi{font-size:22px}
  .gcell .gt{font-family:var(--sans);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
  .gcell .gd{font-family:var(--serif);font-style:italic;font-size:13px;color:#5a4a44;line-height:1.35}
  .drop{width:min(340px,86%);margin:26px auto 0;min-height:150px;border:1px dashed var(--muted);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.3);cursor:pointer;padding:16px}
  .drop .plus{width:52px;height:52px;border-radius:50%;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300}
  .drop .dt{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
  .thumbs img{width:52px;height:52px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
  .field{width:min(340px,86%);margin:22px auto 0;text-align:left}
  .field label{font-family:var(--sans);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .field input{width:100%;margin-top:8px;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;font-family:var(--serif);font-size:18px;color:var(--ink);outline:none}
  .consent{display:flex;align-items:flex-start;gap:10px;width:min(340px,86%);margin:18px auto 0;text-align:left;cursor:pointer}
  .consent .cb{width:18px;height:18px;min-width:18px;border:1px solid var(--muted);border-radius:3px;margin-top:2px;position:relative}
  .consent .cb.on{background:var(--ink);border-color:var(--ink)}
  .consent .cb.on::after{content:'✓';position:absolute;inset:0;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
  .consent p{font-family:var(--serif);font-size:13px;color:#5a4a44;line-height:1.4}
  .consent a{color:var(--ink)}
  .go{margin-top:28px;font-family:var(--sans);font-size:clamp(11px,2.7vw,12.5px);letter-spacing:.22em;text-transform:uppercase;color:var(--ink);background:none;cursor:pointer;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:11px 26px;display:inline-flex;align-items:center;gap:9px}
  .go[disabled]{opacity:.35;pointer-events:none}
  .loadtxt{font-family:var(--serif);font-style:italic;font-size:clamp(19px,5.2vw,26px);color:#4a3d38;margin-top:24px;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
  .loadsub{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:12px;max-width:82%}
  .lerr{display:none;font-family:var(--serif);font-style:italic;color:#b12a1e;font-size:15px;margin-top:18px;max-width:82%}
  .lerr.on{display:block}
  .resrow{display:flex;gap:15px;align-items:flex-start;width:min(94%,600px);margin:0 auto;padding:2.4vh 6px;text-align:left}
  .rimg{width:40%;flex:none;aspect-ratio:3/4;border-radius:8px;border:1px solid rgba(156,134,102,.5);background:radial-gradient(circle at 50% 38%,#efe7d2,#d9c9a6);overflow:hidden;display:flex;align-items:center;justify-content:center}
  .rimg img{width:100%;height:100%;object-fit:cover}
  .rimg .ph{font-size:34px;opacity:.4}
  .rtx{flex:1}
  .rtx .rlab{font-family:var(--disp);text-transform:uppercase;letter-spacing:.09em;color:var(--ink);font-size:clamp(17px,4.6vw,22px)}
  .rtx .rbd{font-family:var(--serif);font-size:clamp(14px,3.7vw,16px);color:#3f332f;line-height:1.55;margin-top:8px}
  .rtx .rbd p{margin-bottom:10px}

    var blocks=String(txt||'').replace(/\r/g,'').split(/\n{2,}/);

      var b=blocks[i].trim(); if(!b) continue;

  function reveal(){

      var io=new IntersectionObserver(function(en){ en.forEach(function(x){ if(x.isIntersecting){ x.target.classList.add('seen'); io.unobserve(x.target); } }); },{threshold:.12});

})();
