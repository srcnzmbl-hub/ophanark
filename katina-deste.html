<!doctype html>
<html lang="tr">

<meta charset="utf-8">
<script>(function(){var ok=false;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/^sb-.*-auth-token$/.test(k)){var o=JSON.parse(localStorage.getItem(k)||"null");if(o&&(o.access_token||(o.currentSession&&o.currentSession.access_token))){ok=true;break;}}}}catch(e){ok=true;}if(!ok)location.replace("index.html");})();</script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPHANARK · Katina Destesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3E8;--ink:#25181C;--line:rgba(37,24,28,.16);--muted:#9c8666;--soft:rgba(37,24,28,.04);
 --disp:'Italiana',serif;--sans:'DM Sans',sans-serif;--serif:'Cormorant Garamond',serif}
:root[data-theme="dark"]{--bg:#080C17;--ink:#DAE7E3;--line:rgba(218,231,227,.16);--muted:#637999;--soft:rgba(218,231,227,.05)}
html[data-theme="dark"],html[data-theme="dark"] body{background:#080C17}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg)}
#app{width:100%;max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);padding-bottom:48px}
.backlink{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.backlink a{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.7;text-decoration:none}
.brandmini{font-family:var(--disp);font-size:15px;letter-spacing:.28em}
.wrap{padding:0 18px}
.page-title{font-family:var(--disp);font-size:clamp(26px,7vw,40px);text-align:center;margin:20px 0 4px;font-weight:400}
.subtitle{text-align:center;font-family:var(--serif);font-size:clamp(15px,4vw,18px);color:var(--muted);margin:0 0 18px}
.elhead{font-family:var(--disp);font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.dcard{margin:0;text-align:center}
.dcard img{width:100%;display:block;border-radius:9px;box-shadow:0 8px 20px rgba(40,25,10,.22);aspect-ratio:2/3;object-fit:cover}
.dcard .nm{font-family:var(--serif);font-size:14px;color:var(--ink);margin-top:7px;line-height:1.15}
.foot{font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--muted);text-align:center;margin:26px auto 0;max-width:52ch}
</style>
</head>
<body>
<div id="app">
  <div class="backlink"><a href="katina.html">&larr; Katina</a><span class="brandmini">OPHANARK</span></div>
  <div class="wrap">
    <h1 class="page-title">Katina Destesi</h1>
    <p class="subtitle">Katina falının tüm kartları</p>
    <div id="deck"></div>
    <p class="foot">Kartların üstüne dokununca büyür.</p>
  </div>
</div>
<script>
(function(){
  var DECK=[{"id": "major-01-capa", "name": "Çapa", "suit": "major"}, {"id": "major-02-tilki", "name": "Tilki", "suit": "major"}, {"id": "major-03-cicekler", "name": "Çiçekler", "suit": "major"}, {"id": "major-04-yildizlar", "name": "Yıldızlar", "suit": "major"}, {"id": "major-05-alyans", "name": "Alyans", "suit": "major"}, {"id": "major-06-dag", "name": "Dağ", "suit": "major"}, {"id": "major-07-yatagan", "name": "Yatağan", "suit": "major"}, {"id": "major-08-mektup", "name": "Mektup", "suit": "major"}, {"id": "major-09-agac", "name": "Ağaç", "suit": "major"}, {"id": "major-10-dervis", "name": "Derviş", "suit": "major"}, {"id": "major-11-yol", "name": "Yol", "suit": "major"}, {"id": "major-12-gunes", "name": "Güneş", "suit": "major"}, {"id": "major-13-deve", "name": "Deve", "suit": "major"}, {"id": "major-14-kalp", "name": "Kalp", "suit": "major"}, {"id": "major-15-bahceler", "name": "Bahçeler", "suit": "major"}, {"id": "major-16-anahtar", "name": "Anahtar", "suit": "major"}, {"id": "major-17-kitap", "name": "Kitap", "suit": "major"}, {"id": "major-18-baykus", "name": "Baykuş", "suit": "major"}, {"id": "major-19-mezar", "name": "Mezar", "suit": "major"}, {"id": "major-20-yelkenli", "name": "Yelkenli", "suit": "major"}, {"id": "major-21-nil-nehri", "name": "Nil Nehri", "suit": "major"}, {"id": "major-22-afyon", "name": "Afyon", "suit": "major"}, {"id": "major-23-kiz-cocugu", "name": "Kız Çocuğu", "suit": "major"}, {"id": "major-24-fareler", "name": "Fareler", "suit": "major"}, {"id": "major-25-kapi", "name": "Kapı", "suit": "major"}, {"id": "major-26-kale", "name": "Kale", "suit": "major"}, {"id": "major-27-samyeli", "name": "Samyeli", "suit": "major"}, {"id": "major-28-kopek", "name": "Köpek", "suit": "major"}, {"id": "major-29-ev", "name": "Ev", "suit": "major"}, {"id": "major-30-hac", "name": "Haç", "suit": "major"}, {"id": "major-31-bulutlar", "name": "Bulutlar", "suit": "major"}, {"id": "major-32-ay", "name": "Ay", "suit": "major"}, {"id": "major-33-yilan", "name": "Yılan", "suit": "major"}, {"id": "major-34-supurge", "name": "Süpürge", "suit": "major"}, {"id": "major-35-balik", "name": "Balık", "suit": "major"}, {"id": "mag-1-attart", "name": "Attart", "suit": "mag"}, {"id": "mag-2-valide", "name": "Valide", "suit": "mag"}, {"id": "toprak-1-abanozun-carki", "name": "Abanoz'un Çarkı", "suit": "toprak"}, {"id": "toprak-2-selana", "name": "Selana", "suit": "toprak"}, {"id": "toprak-3-tattaret", "name": "Tattaret", "suit": "toprak"}, {"id": "toprak-4-assyranta", "name": "Assyranta", "suit": "toprak"}, {"id": "toprak-5-sunit", "name": "Sunit", "suit": "toprak"}, {"id": "toprak-6-turan", "name": "Turan", "suit": "toprak"}, {"id": "toprak-7-munzur", "name": "Munzur", "suit": "toprak"}, {"id": "ates-1-atesin-yakutu", "name": "Ateşin Yakutu", "suit": "ates"}, {"id": "ates-2-ariman", "name": "Ariman", "suit": "ates"}, {"id": "ates-3-selcukassa", "name": "Selçukassa", "suit": "ates"}, {"id": "ates-4-urmia", "name": "Urmia", "suit": "ates"}, {"id": "ates-5-saah", "name": "Saah", "suit": "ates"}, {"id": "ates-6-tagral", "name": "Tagral", "suit": "ates"}, {"id": "ates-7-kalif", "name": "Kalif", "suit": "ates"}, {"id": "su-1-zumrut", "name": "Zümrüt", "suit": "su"}, {"id": "su-2-bedes", "name": "Bedes", "suit": "su"}, {"id": "su-3-mida", "name": "Mida", "suit": "su"}, {"id": "su-4-passandra", "name": "Passandra", "suit": "su"}, {"id": "su-5-aral", "name": "Aral", "suit": "su"}, {"id": "su-6-eprahhat", "name": "Eprahhat", "suit": "su"}, {"id": "su-7-hesse", "name": "Hesse", "suit": "su"}, {"id": "hava-1-buyuk-elmas", "name": "Büyük Elmas", "suit": "hava"}, {"id": "hava-2-isfahan", "name": "İsfahan", "suit": "hava"}, {"id": "hava-3-dastar", "name": "Dastar", "suit": "hava"}, {"id": "hava-4-adhamdeva", "name": "Adhamdeva", "suit": "hava"}, {"id": "hava-5-gamhat", "name": "Gamhat", "suit": "hava"}, {"id": "hava-6-dare", "name": "Dare", "suit": "hava"}, {"id": "hava-7-zara", "name": "Zara", "suit": "hava"}, {"id": "deste-1-bos", "name": "Deste — Boş Kart", "suit": "deste"}, {"id": "deste-2-bos", "name": "Deste — Boş Kart", "suit": "deste"}, {"id": "deste-3-butunluk", "name": "Deste — Bütünlük", "suit": "deste"}];
  var SUIT={"major": "Majör Arkana", "mag": "Maglar", "ates": "Ateş — Yakut", "su": "Su — Zümrüt", "hava": "Hava — Elmas", "toprak": "Toprak — Abanoz", "deste": "Deste"}; var ORDER=["major", "mag", "ates", "su", "hava", "toprak", "deste"];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var host=document.getElementById('deck'); var html='';
  ORDER.forEach(function(su){
    var cards=DECK.filter(function(c){return c.suit===su;}); if(!cards.length) return;
    html+='<div class="elhead">'+esc(SUIT[su])+'</div><div class="grid">';
    cards.forEach(function(c){
      html+='<figure class="dcard"><img loading="lazy" src="katina/'+esc(c.id)+'.webp" alt="'+esc(c.name)+'"><figcaption class="nm">'+esc(c.name)+'</figcaption></figure>';
    });
    html+='</div>';
  });
  host.innerHTML=html;
})();
</script>
</body>
</html>
