<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPHANARK · Paketler</title>

<style>
:root{--bg:#F7F3E8;--ink:#25181C;--line:rgba(37,24,28,.16);--muted:#9c8666;--soft:rgba(37,24,28,.04);--gold:#b98a3e;
  --disp:'Italiana',serif;--sans:'DM Sans',sans-serif;--serif:'Cormorant Garamond',serif}
:root[data-theme="dark"]{--bg:#080C17;--ink:#DAE7E3;--line:rgba(218,231,227,.16);--muted:#637999;--soft:rgba(218,231,227,.05)}
html[data-theme="dark"],html[data-theme="dark"] body{background:#080C17}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg)}
#app{width:100%;max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);overflow-x:hidden;font-family:var(--sans);padding-bottom:40px}
.backlink{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.backlink a{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.7;text-decoration:none}
.backlink a:hover{opacity:1}
.brandmini{font-family:var(--disp);font-size:15px;letter-spacing:.28em;color:var(--ink)}
.wrap{padding:0 20px}
.page-title{font-family:var(--disp);font-size:clamp(28px,8vw,42px);letter-spacing:.02em;text-align:center;margin:24px 0 6px;font-weight:400}
.subtitle{text-align:center;font-family:var(--serif);font-size:clamp(15px,4vw,18px);color:var(--muted);margin:0 0 8px}
.current{text-align:center;font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 26px}
.current b{color:var(--gold);font-weight:500}
.cards{display:flex;flex-direction:column;gap:16px}
.pk{border:1px solid var(--line);border-radius:16px;padding:24px 22px;background:var(--soft);position:relative;transition:.2s}
.pk.hi{border-color:var(--gold);box-shadow:0 10px 40px rgba(185,138,62,.16)}
.pk.active{border-color:var(--ink)}
.pk .tag{position:absolute;top:-11px;left:22px;background:var(--gold);color:#fff;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:5px 12px;border-radius:20px}
.pk .tag.own{background:var(--ink);color:var(--bg)}
.pk h2{font-family:var(--disp);font-size:26px;font-weight:400;letter-spacing:.04em;margin:0 0 2px}
.pk .price{font-family:var(--serif);font-size:30px;color:var(--ink);margin:0 0 2px}
.pk .price small{font-family:var(--sans);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.pk .per{font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}
.pk ul{list-style:none;margin:0 0 20px;padding:0}
.pk li{font-family:var(--serif);font-size:16.5px;line-height:1.35;color:var(--ink);padding:7px 0 7px 24px;position:relative;border-bottom:1px solid var(--line)}
.pk li:last-child{border-bottom:0}
.pk li:before{content:"✦";position:absolute;left:0;top:7px;color:var(--gold);font-size:13px}
.pk .cta{display:block;width:100%;text-align:center;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:15px;font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.pk .cta:hover{opacity:.9}
.pk .cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);cursor:default}
.pk .cta[disabled]{opacity:.55;cursor:not-allowed}
.pk .soon{font-family:var(--sans);font-size:11px;letter-spacing:.03em;color:var(--muted);text-align:center;margin-top:9px;line-height:1.5}
.foot{font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--muted);text-align:center;margin:28px 4px 0;max-width:52ch;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<div id="app">
  <div class="backlink"><a href="scroll.html">← <span data-t="geri">Fallar</span></a><span class="brandmini">OPHANARK</span></div>
  <div class="wrap">
    <h1 class="page-title" data-t="baslik">Paketler</h1>
    <p class="subtitle" data-t="alt">Falların, numeroloji ve yıldıznamen için daha fazlası</p>
    <p class="current" id="cur"></p>
    <div class="cards" id="cards"></div>
    <p class="foot" id="foot"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="oph_app.js"></script>
<script>
(function(){
  var SB_URL='https://lssyopqxthausyegeire.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzc3lvcHF4dGhhdXN5ZWdlaXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTE4MzEsImV4cCI6MjA5OTc4NzgzMX0.WZeL9kPQmC86m747B3jOOObcNR0If4FADH12VxUpFqo';
  var sb=null; try{ sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); }catch(e){}

  /* ====== LEMON SQUEEZY ÖDEME LİNKLERİ ======
     Ürünler yayına alınınca (mağaza onayı + publish) her ürünün "Share"
     linkini buraya yapıştır. Boşken buton "yakında" gösterir. Format:
     https://ozarkcollective.lemonsqueezy.com/buy/XXXXXXXX-....           */
  var LEMON = {
    plus:  'https://ozarkcollective.lemonsqueezy.com/checkout/buy/8de6fa49-4d57-4c7c-98d0-50cc616584cd', // OPHANARK Plus $4.99/ay
    pro:   'https://ozarkcollective.lemonsqueezy.com/checkout/buy/87e8258d-3600-4e01-8b07-ba8abe3306ca', // OPHANARK Pro $9.99/ay
    proTR: 'https://ozarkcollective.lemonsqueezy.com/checkout/buy/ec7f541d-c180-4198-ae7e-a7d950c1d667'  // OPHANARK Pro (Türkiye) $0.99/ay
  };

  var lang = (window.OphApp && OphApp.getLang && OphApp.getLang()==='tr') ? 'tr' : (window.OphApp && OphApp.getLang && OphApp.getLang()==='en' ? 'en' : (OphApp&&OphApp.getLang?( ['tr','en'].indexOf(OphApp.getLang())>=0?OphApp.getLang():'en'):'tr'));
  var TR = lang==='tr';

  var STR = {
    geri: TR?'Fallar':'Fortunes',
    baslik: TR?'Paketler':'Plans',
    alt: TR?'Falların, numeroloji ve yıldızname için daha fazlası':'More readings, numerology & star-name insights',
    cur: function(s){ var ad={free:TR?'Ücretsiz':'Free',plus:'Plus',pro:'Pro'}[s]||'Ücretsiz'; return (TR?'Mevcut paketin: ':'Your plan: ')+'<b>'+ad+'</b>'; },
    own: TR?'Mevcut':'Current',
    pop: TR?'Popüler':'Popular',
    trtag: TR?'Türkiye’ye özel':'Turkey price',
    ay: TR?'/ay':'/mo',
    ucretsiz: TR?'Zaten senin':'Included',
    al: TR?'Satın al':'Get it',
    soon: TR?'Ödeme çok yakında aktif olacak (mağaza onayı bekleniyor).':'Checkout goes live soon (store verification pending).',
    foot: TR
      ? 'Ödeme Lemon Squeezy üzerinden güvenle alınır. İstediğin zaman iptal edebilirsin. Fiyatlara vergiler dahil olabilir.'
      : 'Payments are handled securely by Lemon Squeezy. Cancel anytime. Taxes may apply.'
  };

  var FEAT = {
    free: TR
      ? ['Kahve · El · Natal · Tarot · Katina: günde 1','Burçlar ve Melek kartları: sınırsız','Numeroloji · Yıldızname: 3 günde 1']
      : ['Coffee · Palm · Natal · Tarot · Katina: 1/day','Horoscopes & Angel cards: unlimited','Numerology · Star name: once / 3 days'],
    plus: TR
      ? ['Kahve · El · Natal: günde 3','Tarot ve Katina: sınırsız','Burçlar ve Melek: sınırsız','Numeroloji · Yıldızname: 2 günde 1']
      : ['Coffee · Palm · Natal: 3/day','Tarot & Katina: unlimited','Horoscopes & Angel: unlimited','Numerology · Star name: once / 2 days'],
    pro: TR
      ? ['Tüm fallar: sınırsız','Numeroloji · Yıldızname: günde 1','Öncelikli işlem']
      : ['All readings: unlimited','Numerology · Star name: 1/day','Priority processing'],
    proTR: TR
      ? ['Tüm fallar: sınırsız','Numeroloji · Yıldızname: günde 1','Türkiye’ye özel fiyat']
      : ['All readings: unlimited','Numerology · Star name: 1/day','Special Turkey price']
  };

  var userEmail='';
  var seviye = (window.OphApp && OphApp.paketSeviye) ? OphApp.paketSeviye() : 'free';

  // statik metinleri yerleştir
  document.querySelectorAll('[data-t]').forEach(function(el){ var k=el.getAttribute('data-t'); if(STR[k]!=null && typeof STR[k]==='string') el.textContent=STR[k]; });
  document.getElementById('foot').textContent = STR.foot;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function checkoutUrl(base){
    if(!base) return '';
    var u=base + (base.indexOf('?')>=0?'&':'?') + 'checkout[email]='+encodeURIComponent(userEmail||'');
    return u;
  }

  function cardHTML(id, name, price, per, feats, ctaKey){
    var own = (seviye===id) || (id==='proTR' && seviye==='pro');
    var hi = (id==='pro' || id==='proTR');
    var cls = 'pk'+(hi?' hi':'')+(own?' active':'');
    var tag = own ? '<span class="tag own">'+STR.own+'</span>' : (id==='plus' ? '<span class="tag">'+STR.pop+'</span>' : (id==='proTR' ? '<span class="tag">'+STR.trtag+'</span>' : ''));
    var lis = feats.map(function(f){ return '<li>'+esc(f)+'</li>'; }).join('');
    var cta;
    if(id==='free'){
      cta = '<button class="cta ghost" disabled>'+STR.ucretsiz+'</button>';
    } else if(own){
      cta = '<button class="cta ghost" disabled>'+STR.own+'</button>';
    } else {
      var url = checkoutUrl(LEMON[id]);
      if(url){ cta = '<a class="cta" href="'+esc(url)+'" target="_blank" rel="noopener">'+STR.al+'</a>'; }
      else { cta = '<button class="cta" disabled>'+STR.al+'</button><div class="soon">'+STR.soon+'</div>'; }
    }
    return '<div class="'+cls+'">'+tag+
      '<h2>'+esc(name)+'</h2>'+
      '<div class="price">'+esc(price)+' <small>'+esc(per)+'</small></div>'+
      '<ul>'+lis+'</ul>'+cta+'</div>';
  }

  function render(){
    document.getElementById('cur').innerHTML = STR.cur(seviye);
    var tr = (window.OphApp && OphApp.bolgeTR) ? OphApp.bolgeTR() : false;
    var html='';
    html += cardHTML('free', (TR?'Ücretsiz':'Free'), (TR?'₺0':'$0'), '', FEAT.free);
    if(tr){
      html += cardHTML('proTR', (TR?'Tam Paket':'Full Access'), '$0.99', STR.ay, FEAT.proTR);
    } else {
      html += cardHTML('plus', 'Plus', '$4.99', STR.ay, FEAT.plus);
      html += cardHTML('pro',  'Pro',  '$9.99', STR.ay, FEAT.pro);
    }
    document.getElementById('cards').innerHTML = html;
  }

  render();

  // giriş bilgisi + güncel seviye
  if(sb){
    sb.auth.getUser().then(function(r){
      try{ userEmail=(r&&r.data&&r.data.user&&r.data.user.email)||''; }catch(e){}
      render(); // e-posta gelince checkout linklerini e-posta ile yeniden kur
    }).catch(function(){});
  }
  if(window.OphApp && OphApp.paketYukle){
    OphApp.paketYukle().then(function(s){ if(s && s!==seviye){ seviye=s; render(); } });
  }
})();
</script>
</body>
