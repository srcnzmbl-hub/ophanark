<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#000000" />
<title>Paketler — OPHANARK</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{ --gold:#D4AF37; --gold-soft:#e6c766; --text:#F1ECFB; --muted:#B9B2CE; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#000; }
  body{
    color:var(--text);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.6; font-size:15px; -webkit-font-smoothing:antialiased;
  }
  /* Nebula yalnızca 9:16 kolonun içinde; dışı siyah */
  .bg{
    position:fixed; top:0; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:430px; z-index:0;
    background:#000 url("/assets/0fa7e7e17_generated_image.png") top center / cover no-repeat;
  }
  .bg::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.82) 42%, #000 78%); }

  .screen{ position:relative; z-index:1; width:100%; max-width:430px; margin:0 auto;
    min-height:100vh; padding:1.4cm 22px 70px; }

  header{ text-align:center; margin-bottom:28px; }
  .wordmark{ font-family:Geist,ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:clamp(54px,18vw,76px); letter-spacing:-0.01em; color:#fff; line-height:1; }
  .wordmark .dot{ display:inline-block; width:0.22em; height:0.22em; margin-left:0.16em;
    transform:translateY(0.04em); vertical-align:baseline;
    background:radial-gradient(circle at 35% 30%, #F5E6A8 0%, #D4AF37 40%, #8a6a1f 72%, #4a3a12 100%);
    box-shadow:0 0 0.4em rgba(212,175,55,0.9), 0 0 1.2em rgba(212,175,55,0.5), inset 0 0 0.25em rgba(255,240,200,0.5); }
  .sub{ color:var(--muted); font-size:11px; letter-spacing:.28em; text-transform:uppercase; margin-top:1.5cm; }
  /* wordmark hariç her şey net Inter */
  .sub,.pname,.ptag,.feats,.feats li,.price,.buy,.state,.note,.back{
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif !important; }

  #list{ display:flex; flex-direction:column; gap:30px; }

  .card{ padding:4px 2px 6px; }

  .chead{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .cinfo{ text-align:left; }
  .badge{ width:62px; height:62px; flex:0 0 62px; object-fit:contain; filter:drop-shadow(0 0 12px rgba(212,175,55,.42)); }
  .pname{ font-size:22px; font-weight:700; color:var(--gold); letter-spacing:.02em; }
  .ptag{ display:block; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); margin-top:4px; }

  .feats{ list-style:none; margin:18px 0 2px; text-align:left; }
  .feats li{ position:relative; padding-left:16px; margin:8px 0; font-size:14px; color:var(--text); }
  .feats li::before{ content:"·"; color:var(--gold); position:absolute; left:2px; top:-2px; font-size:18px; }

  .price{ margin-top:20px; text-align:center; font-size:24px; font-weight:800; color:#fff; }
  .price .cur{ color:var(--gold); }

  .buy{
    display:inline-block; margin-top:14px; width:100%;
    background:transparent; color:var(--gold); border:2px solid var(--gold);
    font-weight:700; font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    padding:13px 20px; border-radius:10px; cursor:pointer; transition:.2s;
  }
  .buy:hover{ background:var(--gold); color:#0a0a0a; }
  .state{ margin-top:18px; text-align:center; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  .gift{ color:var(--gold-soft); }
  .note{ margin-top:8px; text-align:center; font-size:12px; font-style:italic; color:var(--muted); }

  .backwrap{ text-align:center; margin-top:36px; }
  .backbtn{ display:inline-block; background:transparent; border:1px solid var(--gold); color:var(--gold);
    font-family:"Inter",sans-serif; font-size:12px; letter-spacing:.2em; text-transform:uppercase;
    padding:11px 30px; border-radius:10px; cursor:pointer; transition:.2s; }
  .backbtn:hover{ background:var(--gold); color:#0a0a0a; }

  #toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:rgba(20,16,28,.96); border:1px solid rgba(212,175,55,.4); color:var(--text);
    padding:12px 20px; border-radius:10px; font-size:13px; z-index:10; opacity:0; transition:.3s; pointer-events:none; max-width:380px; text-align:center; }
  #toast.show{ opacity:1; }
  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 1cm;border-bottom:1px solid rgba(212,175,55,.15);background:rgba(0,0,0,.85);backdrop-filter:blur(8px)}
  .topbar .brand{font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:12px;font-weight:300;letter-spacing:.42em;color:#F5F0E6;text-decoration:none;border:none}
  .topnav{display:flex;align-items:center;gap:0.5cm;font-size:9px;text-transform:uppercase;letter-spacing:.14em;white-space:nowrap}
  .topnav a{color:#F5F0E6;text-decoration:none;border:none}
  .topnav a:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="bg"></div>
<header class="topbar"><a class="brand" href="/">OPHANARK</a><nav class="topnav"><a href="/#fallar">Bölümler</a><a href="/profil">Profil</a><a href="/hazir">Hazır Fallarım</a></nav></header>

<main class="screen">
  <header>
    <div class="wordmark">ophanark<span class="dot"></span></div>
    <div class="sub">Paketler</div>
  </header>

  <div id="list"></div>

  <div class="backwrap"><button class="backbtn" onclick="if(history.length>1){history.back()}else{location.href='/'}">← Geri</button></div>
</main>

<div id="toast"></div>

<script>
(function(){
  // Bölge: Türkiye kullanıcısı otomatik TR fiyatı, diğerleri global fiyatı görür
  var tz=""; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||""; }catch(e){}
  var lang=(navigator.language||navigator.userLanguage||"").toLowerCase();
  var isTR = /istanbul|turkey/i.test(tz) || lang.indexOf("tr")===0;

  var PACKAGES=[
    { sku:null, badge:"safir",  name:"Safir", tier:"Basic",
      feats:["Kahve & El — günde 1","Tarot & Katina — günde 1 (tekli çekim sınırsız)","Natal — haftada 1","Burç & Melek — sınırsız"],
      free:true },
    { sku:"plus", badge:"yakut", name:"Yakut", tier:"Plus", pop:true,
      feats:["Kahve & El — günde 2","Tarot & Katina — sınırsız","Natal — günde 1","Numeroloji & Yıldızname — haftada 1"],
      tr:"1.49", global:"4.99" },
    { sku:"pro", badge:"zumrut", name:"Zümrüt", tier:"Pro",
      feats:["Kahve & El — günde 3","Tarot, Katina & Natal — sınırsız","Numeroloji & Yıldızname — günde 1"],
      tr:"2.49", global:"14.99" },
    { sku:"promax", badge:"elmas", name:"Elmas", tier:"Pro Max",
      feats:["Kahve & El — sınırsız","Tarot & Katina — sınırsız","Natal — günde 3","Numeroloji & Yıldızname — günde 3"],
      tr:"9.99", global:"24.99" },
    { sku:null, badge:"unique", name:"Unique", tier:"Hediye",
      feats:["Tüm fallar — sınırsız","Sistem tarafından özel kullanıcılara verilir"],
      gift:true, note:"Hayatta para ile alınamayan şeyler vardır." }
  ];

  function toast(msg){
    var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(window.__tt); window.__tt=setTimeout(function(){ t.classList.remove("show"); },3200);
  }

  // --- Play Billing yapılandırması ---
  var SUPA_URL="https://lssyopqxthausyegeire.supabase.co";
  var SUPA_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzc3lvcHF4dGhhdXN5ZWdlaXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTE4MzEsImV4cCI6MjA5OTc4NzgzMX0.WZeL9kPQmC86m747B3jOOObcNR0If4FADH12VxUpFqo";
  var BILLING="https://play.google.com/billing";

  // Uygulamanın Supabase oturumunu (aynı origin localStorage) oku
  function getAccessToken(){
    try{
      var raw=localStorage.getItem("sb-lssyopqxthausyegeire-auth-token");
      if(!raw) return null;
      var j=JSON.parse(raw);
      return j.access_token || (j.currentSession&&j.currentSession.access_token) || (j.session&&j.session.access_token) || null;
    }catch(e){ return null; }
  }

  async function verifyPurchase(productId, purchaseToken, token){
    var res=await fetch(SUPA_URL+"/functions/v1/play-verify",{
      method:"POST",
      headers:{ "Content-Type":"application/json", "apikey":SUPA_ANON, "Authorization":"Bearer "+token },
      body:JSON.stringify({ productId:productId, purchaseToken:purchaseToken })
    });
    var data={}; try{ data=await res.json(); }catch(e){}
    return { ok:res.ok, data:data };
  }

  async function buy(sku,name){
    if(!sku){ return; }
    // TWA / Play Billing yoksa (masaüstü web) bilgilendir
    if(!window.getDigitalGoodsService){
      toast("Satın alma yalnızca Google Play uygulamasında yapılabilir.");
      return;
    }
    // Oturum kontrolü — abonelik hesaba bağlanacağı için giriş şart
    var token=getAccessToken();
    if(!token){
      toast("Önce giriş yapmalısın. Profil sayfasından giriş yapıp tekrar dene.");
      setTimeout(function(){ window.location.href="/profil"; },1800);
      return;
    }
    try{
      var service=await window.getDigitalGoodsService(BILLING);
      var details=await service.getDetails([sku]);
      if(!details || !details.length){ toast("Ürün bulunamadı, lütfen daha sonra tekrar dene."); return; }
      var item=details[0];
      var pr=new PaymentRequest(
        [{ supportedMethods:BILLING, data:{ sku:sku } }],
        { total:{ label:item.title||name, amount:{ currency:item.price.currency, value:item.price.value } } }
      );
      var resp=await pr.show();
      var purchaseToken=(resp.details&&resp.details.purchaseToken)||null;
      if(!purchaseToken){ await resp.complete("fail"); toast("Satın alma tamamlanamadı."); return; }
      toast("Doğrulanıyor…");
      var v=await verifyPurchase(sku, purchaseToken, token);
      if(v.ok && v.data && v.data.ok){
        try{ await service.acknowledge(purchaseToken, "onetime"); }catch(e){}
        await resp.complete("success");
        toast(name+" aboneliğin aktif! 🎉");
        setTimeout(function(){ window.location.href="/profil"; },1800);
      } else {
        await resp.complete("fail");
        var msg=(v.data&&v.data.error)||"bilinmeyen";
        toast("Doğrulama başarısız ("+msg+"). Ödemen alındıysa kısa süre içinde tanımlanır.");
      }
    }catch(e){
      // Kullanıcı iptal ettiyse sessiz geç
      var m=(e&&e.message)||"";
      if(/cancel|abort|dismiss/i.test(m)){ return; }
      toast("Bir sorun oluştu: "+m);
    }
  }

  var list=document.getElementById("list");
  PACKAGES.forEach(function(p){
    var card=document.createElement("div");
    card.className="card";
    var html="";
    html+='<div class="chead"><div class="cinfo"><span class="pname">'+p.name+'</span><span class="ptag">'+p.tier+'</span></div>';
    html+='<img class="badge" src="/assets/badge-'+p.badge+'.png" alt="'+p.name+'" /></div>';
    html+='<ul class="feats">';
    p.feats.forEach(function(f){ html+='<li>'+f+'</li>'; });
    html+='</ul>';
    if(p.free){
      html+='<div class="state">Ücretsiz</div>';
    } else if(p.gift){
      html+='<div class="state gift">Hediye — satın alınamaz</div>';
      if(p.note) html+='<div class="note">'+p.note+'</div>';
    } else {
      var val=isTR?p.tr:p.global;
      html+='<div class="price"><span class="cur">$</span>'+val+'</div>';
      html+='<button class="buy" data-sku="'+p.sku+'" data-name="'+p.name+'">Satın Al</button>';
    }
    card.innerHTML=html;
    var b=card.querySelector(".buy");
    if(b) b.addEventListener("click",function(){ buy(this.getAttribute("data-sku"), this.getAttribute("data-name")); });
    list.appendChild(card);
  });
})();
</script>
</body>
</html>
