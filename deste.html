<style>
:root{--bg:#F7F3E8;--ink:#25181C;--line:rgba(37,24,28,.16);--muted:#9c8666;--soft:rgba(37,24,28,.04);
 --disp:'Italiana',serif;--sans:'DM Sans',sans-serif;--serif:'Cormorant Garamond',serif}
:root[data-theme="dark"]{--bg:#080C17;--ink:#DAE7E3;--line:rgba(218,231,227,.16);--muted:#637999;--soft:rgba(218,231,227,.05)}
html[data-theme="dark"],html[data-theme="dark"] body{background:#080C17}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg)}
#app{width:100%;max-width:760px;margin:0 auto;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);padding-bottom:48px}
.backlink{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.backlink a{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.7;text-decoration:none}
.brandmini{font-family:var(--disp);font-size:15px;letter-spacing:.28em}

.page-title{font-family:var(--disp);font-size:clamp(26px,7vw,40px);text-align:center;margin:20px 0 4px;font-weight:400}

.elhead{font-family:var(--disp);font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.elhead small{font-family:var(--serif);font-size:15px;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px}
.dcard{position:relative;margin:0;container-type:inline-size}
.dcard>img{width:100%;display:block;border-radius:10px;box-shadow:0 8px 20px rgba(40,25,10,.22)}
.ddesc{position:absolute;left:20%;right:20%;bottom:5.4%;text-align:center;

  font-size:clamp(9px,3.5cqw,14px);text-wrap:balance}
.foot{font-family:var(--sans);font-size:11.5px;line-height:1.6;color:var(--muted);text-align:center;margin:26px auto 0;max-width:52ch}
</style>

d is closing; heal."}, "22": {"tr": "Bir bağ derinleşiyor; sevgiyle yaklaş.", "en": "A bond deepens; approach with love."}, "23": {"tr": "Şifanın başmeleği — iyileşeceksin.", "en": "Archangel of healing — you will heal."}, "24": {"tr": "İyileşme başladı; kendine iyi bak.", "en": "Healing has begun; take good care."}, "25": {"tr": "Sis dağılıyor; cevap netleşecek.", "en": "The fog lifts; the answer will become clear."}, "26": {"tr": "Konuş, ifade et, sustuğunu söyle.", "en": "Speak, express, say what you've held back."}, "27": {"tr": "Gerçeği gör ve dürüst ol.", "en": "See the truth and be honest."}, "28": {"tr": "Bir fikir kapını çalıyor; yakala.", "en": "An idea is knocking; catch it."}, "29": {"tr": "Aşırı düşünmeyi bırak; bir nefes al.", "en": "Stop overthinking; take a breath."}, "30": {"tr": "Öğrenmeye açık ol; yol gösterilecek.", "en": "Stay open to learning; you'll be guided."}, "31": {"tr": "Soruna başka pencereden bak.", "en": "Look at the problem from another window."}, "32": {"tr": "Seni sıkan kalıbı gevşet; kanatlan.", "en": "Loosen what confines you; take wing."}, "33": {"tr": "Endişeni bırak; bugüne dön, nefes al.", "en": "Let go of worry; return to today, breathe."}, "34": {"tr": "Bilgelik ve istikrarın başmeleği.", "en": "Archangel of wisdom and stability."}, "35": {"tr": "Bolluk akıyor; kıtlık korkusunu bırak.", "en": "Abundance flows; release the fear of lack."}, "36": {"tr": "Şans kapıları aralanıyor; 'evet' de.", "en": "Doors of luck are opening; say 'yes'."}, "37": {"tr": "Acele etme; her şey zamanında.", "en": "Don't rush; all in its right time."}, "38": {"tr": "Yavaş ama sağlam inşa et.", "en": "Build slowly but solidly."}, "39": {"tr": "Bedenine kulak ver; dinlen, beslen.", "en": "Listen to your body; rest and nourish."}, "40": {"tr": "Sahip olduklarına şükret.", "en": "Give thanks for what you have."}, "41": {"tr": "Ayaklarını yere bas; huzur şimdide.", "en": "Ground yourself; peace is in the present."}, "42": {"tr": "Emeğin boşa gitmiyor; s Şükür"}, "41": {"el": "toprak", "name": "Şimdiye Dön"}, "42": {"el": "toprak", "name": "Emek & Sadakat"}, "43": {"el": "toprak", "name": "Yeterlilik"}, "44": {"el": "toprak", "name": "Nimet"}};
  var EL={ates:{tr:'Ateş · Başmelek Mikail',en:'Fire · Archangel Michael',renk:'#c0392b'},
