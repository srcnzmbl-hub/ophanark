"deste-1-bos","Deste — Boş Kart","Henüz açılmamış niyet, boşluk."],["deste-2-bos","Deste — Boş Kart","Henüz açılmamış niyet, boşluk."],["deste-3-butunluk","Deste — Bütünlük","Birlik, bütün ve uyum."]],R1=s4.map(([t,e,n])=>({img:`${r4}/katina/${t}.webp`,name:e,meaning:n})),i4="https://raw.githubusercontent.com/srcnzmbl-hub/ophanark/main",a4=[[1,"Başmelek Mikail","koruma · cesaret",'Koruma ve cesaretin başmeleği; Ateş serisinin yöneticisidir. Korkularını kesip atman ve zor bir kararda dimdik durman için yanındadır; sana kalkan ve alevden kılıç olur. Mesajı: "Korkma, ben arkandayım."'],[2,"Cesaret","cesaret · korkuyu aşmak","Melekler cesur olmanı istiyor: içindeki korkuya rağmen o adımı at. Güç zaten sende; bir nefeslik cesaret yeter."],[3,"Koruma","güven · kalkan","Korunuyorsun. Görünür-görünmez tehlikelere karşı melekler etrafında bir kalkan örüyor; güvende olduğunu bil, endişeyi bırak."],[4,"Eyleme Geç","eylem · başlangıç","Beklemenin vakti geçti; harekete geçme zamanı. Küçük de olsa bir adım at, kapı sen yürüdükçe açılır."],[5,"Sınır Koy","sınır · öz-saygı","Kendini korumak bencillik değil. Enerjini tüketen şeye ya da kişiye nazikçe 'hayır' demen için melekler yanında."],[6,"Öz-Güven","güven · değer","Kendine güven; değerin başkasının onayına bağlı değil. Bu kart, içindeki gücü hatırlaman için geldi."],[7,"Tutku","tutku · kalp","Kalbini yakan şeyin peşinden git. Tutku, ruhunun sana 'bu yol senin' deme biçimidir."],[8,"Liderlik","liderlik · ilham","Öne çıkma, yön verme vakti. Başkalarına ilham olacak ışığın var; sorumluluğu üstlenmekten çekinme."],[9,"Arınma","arınma · hafifleme","Ağırlaştıran eski enerjiyi bırak. Melekler seni temizliyor; kızgınlığı ve yorgunluğu ateşe ver, hafifle."],[10,"İrade Gücü","irade · azim","İçindeki irade sandığından güçlü. Kararında dur, vazgeçme; azminle imkânsızı eğer."],[11,"Yeniden Doğuş","yenilenme · dönüşüm","Bir dönem kapanıyor, yenisi doğuyor. Küllerinden doğan bir ateşsin; geçmişi bırak, yeni ateşi yak."],[12,"Başmelek Cebrail","müjde · sezgi",'Müjde ve sezginin başmeleği; Su serisinin yöneticisidir. İçindeki sesi duyman ve yeni bir başlangıca güvenmen için yanında; yaratıcılığını açar. Mesajı: "Güzel bir haber yolda."'],[13,"Sevgi","sevgi · kalp","Sevgi kapını çalıyor. Melekler kalbini açmanı istiyor; hem vermeye hem almaya izin ver."],[14,"Sezgi","iç ses · his","İç sesin haklı. O ilk hissi görmezden gelme; cevap çoktan içine fısıldandı."],[15,"Duygularını Onurlandır","duygu · kabul","Hissettiğin şey geçerli. Duygularını bastırma; onları nazikçe kabul et, akıp geçmelerine izin ver."],[16,"Öz-Şefkat","şefkat · nezaket","Kendine, sevdiğin birine davranır gibi davran. Kendini yargılamayı bırak, yumuşa."],[17,"Affet","affetme · bırakma","Bir yükü bırakma vakti. Affetmek onu değil seni özgürleştirir; kalbindeki taşı indir."],[18,"Teslim Ol","akış · güven","Her şeyi kontrol etmek zorunda değilsin. Akışa güven; melekler senin için en hayırlısını dokuyor."],[19,"Rüya & İşaretler","rüya · sembol","Etrafındaki işaretlere ve rüyalarına dikkat et. Melekler seninle sembollerle konuşuyor."],[20,"İç Ses","sessizlik · rehberlik","Dışarının gürültüsünü kıs, içeriyi dinle. Aradığın rehberlik senin sessizliğinde."],[21,"Duygusal Şifa","şifa · onarım","Eski bir yara kapanıyor. Melekler kalbindeki kırığı sarıyor; iyileşmene izin ver, acele etme."],[22,"İlişki & Uyum","bağ · huzur","Bir bağ derinleşiyor ya da onarılıyor. Sevgiyle, sabırla yaklaş; aranıza huzur geliyor."],[23,"Başmelek Rafael","şifa · berraklık",'Şifanın başmeleği; Hava serisinin yöneticisidir. Beden-zihin-ruh sağlığında ve bir yarıyı iyileştirmede yanında; zihnini berraklaştırır. Mesajı: "İyileşeceksin."'],[24,"Şifa","iyileşme · özen","İyileşme başladı. Kendine iyi bak; melekler bedenine ve ruhuna şifa taşıyor, sabırlı ol."],[25,"Berraklık","netlik · sabır","Sis dağılıyor. Kafan karışıksa bekle; cevap yakında netleşecek, zorlama."],[26,"İletişim","ifade · söz","Konuş, ifade et, sustuğunu söyle. Açık ve nazik bir söz düğümü çözecek."],[27,"Hakikat","gerçek · dürüstlük","Gerçeği gör ve söyle. Melekler perdenin ardını göstermene, dürüst olmana destek veriyor."],[28,"İlham","fikir · yaratıcılık","Bir fikir kapını çalıyor. Zihnini aç; ilham bir melek dokunuşudur, onu yakala."],[29,"Zihnini Sakinleştir","sükunet · nefes","Aşırı düşünmeyi bırak. Bir nefes al; melekler zihnindeki fırtınayı dindiriyor."],[30,"Öğrenme & Bilgi","öğrenme · yol","Öğrenmeye açık ol. Bir bilgi, bir ders, bir kitap tam da şimdi sana yol gösterecek."],[31,"Bakış Açını Değiştir","perspektif · esneklik","Soruna başka bir pencereden bak. 'Aynı manzara farklı yerden güzel' diyor melekler."],[32,"Özgürlük","özgürlük · kanat","Seni sıkan kalıbı gevşet. Ruhun özgürlük istiyor; kanatlarını açmana izin ver."],[33,"Endişeyi Sal","teslimiyet · huzur","Endişeni meleklere bırak. Taşıdığın yükünün çoğu daha olmadı bile; bugüne dön, nefes al."],[34,"Başmelek Uriel","bilgelik · istikrar",'Bilgelik ve istikrarın başmeleği; Toprak serisinin yöneticisidir. Çözülmeyen bir sorunu aydınlatman ve ayaklarını yere basmanda yanında. Mesajı: "İçindeki bilgelik yolu aydınlatacak."'],[35,"Bolluk","bolluk · açıklık","Bolluk sana akıyor. Kıtlık korkusunu bırak; açık ellerle ver ve al, kucağın dolsun."],[36,"Bereket & Şans","bereket · fırsat","Şans kapıları aralanıyor. Emeğin bereketle dönecek; fırsatı gördüğünde 'evet' de."],[37,"Sabır","sabır · zamanlama","Acele etme; her şey doğru zamanında. Tohum toprakta olgunlaşıyor, güven ve bekle."],[38,"Sağlam Temel","istikrar · inşa","Kalıcı bir şey inşa ediyorsun. Yavaş ama sağlam ilerle; melekler temelini tutuyor."],[39,"Sağlık & Beden","sağlık · denge","Bedenine kulak ver. Dinlen, beslen, hareket et; melekler sağlığına özen göstermeni istiyor."],[40,"Şükür","şükür · minnet","Sahip olduklarına şükret. Şükür bereketin anahtarıdır; bugün üç güzelliği say."],[41,"Şimdiye Dön","topraklanma · an","Zihnin geleceğe kaçıyorsa geri dön. Ayaklarını yere bas, bu ana gel; huzur şimdide."],[42,"Emek & Sadakat","emek · sebat","Emeğin boşa gitmiyor. Sabırla ve sadakatle çalışmaya devam et; karşılığı katlanarak gelecek."],[43,"Yeterlilik","değer · güven","Yeterince iyisin, yeterince varsın. Melekler 'eksik değilsin' diyor; kendine güven."],[44,"Nimet","kutsanma · lütuf","Görünmez bir bereketle kutsanıyorsun. Fark et, minnet duy; iyi şeyler yolda ve sen bunu hak ediyorsun."]],D1=a4.map(([t,e,n,r])=>({img:`${i4}/melek/melek-${String(t).padStart(2,"0")}.webp`,name:e,kicker:n,meaning:r}));function o4({item:t,list:e,onSelect:n,onBack:r}){return h.jsxs(Ee.div,{initial:{opacity:0,y:24},animate:{opacity:1,y:0},exit:{opacity:0,y:-24},transition:{duration:.6},className:"relative z-10 mx-auto w-full max-w-2xl text-center",children:[h.jsx("p",{className:"text-[10px] uppercase tracking-[.42em] text-[#D4AF37]",children:t.kicker}),h.jsx("h1",{className:"mt-6 font-body font-bold tracking-[-0.02em] text-6xl leading-[1.05] md:text-7xl",children:t.title}),h.jsx("span",{className:"mx-auto mt-7 block h-px w-20 bg-[#D4AF37]/60"}),h.jsx("div",{className:"mt-12 flex flex-col",children:e.options.map((a,o)=>h.jsxs("button",{onClick:()=>n(a.id),className:"group flex w-full items-center justify-between border-b border-[#D4AF37]/15 py-5 text-left transition-colors hover:border-[#D4AF37]/50",children:[h.jsx("span",{className:"text-[11px] tracking-[.3em] text-[#D4AF37]/50",children:String(o+1).padStart(2,"0")}),h.jsx("span",{className:"text-right font-body text-2xl text-[#F5F0E6] transition-colors group-hover:text-[#D4AF37] md:text-3xl",children:a.label})]},a.id))}),h.jsxs("div",{className:"mt-10 flex items-center justify-center gap-5",children:[h.jsxs("button",{onClick:r,className:"inline-flex items-center gap-2 border border-[#D4AF37]/40 px-9 py-3 text-[11px] uppercase tracking-[.3em] text-[#D4AF37] transition-colors hover:bg-[#D4AF37] hover:text-black",children:[h.jsx(Jt,{className:"h-4 w-4"})," Geri"]}),e.deck&&h.jsx(dn,{to:`/deste/${t.slug}`,className:"inline-flex items-center border border-[#D4AF37] px-9 py-3 text-[11px] upp ndi yolunu çizmek ve bağımsız durabilmek senin doğanda. Güneş gibi merkezde parlarsın; başkalarına yön verirsin. Gölgen ise inatçılık ve bencilliğe kayabilmek — gücünü paylaşmayı öğrendiğinde asıl liderliğe ulaşırsın."},2:{t:"Uyum Getiren",kw:"Sezgi · Duygu · İşbirliği",body:"Ay gibi hassas, sezgisel ve uyumlusun. İnsanların arasını yapar, incelikle bağ kurarsın; duyguları senden iyi okuyan azdır. Denge ve diplomasi senin armağanın. Gölgen kararsızlık ve aşırı alınganlık — kendi değerine güvendiğinde bu hassasiyet en büyük gücün olur."},3:{t:"İfade Eden",kw:"Yaratıcılık · Neşe · Bereket",body:"Jüpiter'in bereketini taşırsın: yaratıcı, iletişimi güçlü, neşeli ve iyimser. Kelimeler, sanat ve ilham senin alanın; girdiğin ortamı canlandırırsın. Bolluk sana akar. Gölgen dağınıklık ve yüzeysellik olabilir — odaklandığında yeteneğin sınır tanımaz."},4:{t:"İnşa Eden",kw:"Düzen · Emek · Özgünlük",body:"Uranüs'ün titreşimiyle hem sağlam bir düzen kurucusu hem de beklenmedik bir yenilikçisin. Emeğe, disipline ve gerçekliğe saygı duyarsın; ama içinde kuralları kıran özgün bir ruh da var. Gölgen katılık ve huzursuzluk — sabrı özgürlükle dengelediğinde kalıcı şeyler inşa edersin."},5:{t:"Özgür Ruh",kw:"Değişim · Zeka · Hareket",body:"Merkür gibi hızlı, zeki, meraklı ve çok yönlüsün. Özgürlük, seyahat, değişim ve iletişim seni besler; tek bir kalıba sığmazsın. İnsanları kolayca etkiler, çabuk öğrenirsin. Gölgen savrukluk ve huzursuzluk — enerjini bir yöne akıttığında olağanüstü işler çıkarırsın."},6:{t:"Sevgiyle Bağlanan",kw:"Sevgi · Uyum · Sorumluluk",body:"Venüs'ün sıcaklığını taşırsın: sevgi dolu, estetik, sorumlu ve şefkatli. Aile, güzellik ve uyum senin için kutsaldır; sevdiklerin için bir sığınak olursun. Gölgen fazla fedakarlık ve kaygı — kendine de sevgiyle baktığında verdiğin sevgi tükenmez bir kaynağa dönüşür."},7:{t:"Bilge Arayıcı",kw:"Maneviyat · Sezgi · Derinlik",body:"Neptün'ün gizemini taşırsın: içe dönük, sezgisel, derin ve ruhsal. Yüzeyle yetinmez, şeylerin ardındaki anlamı ararsın; yalnızlığın sana bilgelik getirir. Gölgen kaçış ve kopukluk olabilir — iç sesine güvendiğinde adeta görünmeyeni görürsün."},8:{t:"Usta",kw:"Güç · Adalet · Dayanıklılık",body:"Satürn'ün otoritesini taşırsın: güçlü, disiplinli, maddeyi ve dünyayı yönetmeye yatkın. Hayat sana ağır sınavlar verir ama her sınav seni bilenir; adaleti ve emeği önemsersin. Gölgen sertlik ve takıntı — sabırla yürüdüğünde büyük başarılar ve kalıcı bir güç seni bekler."},9:{t:"Tamamlayan",kw:"Cesaret · Tutku · İnsanlık",body:"Mars'ın ateşini taşırsın: cesur, tutkulu, mücadeleci ve büyük kalpli. Biten döngüleri kapatır, yeniye alan açarsın; insanlık ve idealler için savaşırsın. Gölgen öfke ve sabırsızlık — enerjini şefkatle yönlendirdiğinde gerçek bir kahramana dönüşürsün."}},yi={life:"Doğum tarihinden doğar — bu hayattaki ana temanı ve ruhunun yürüdüğü yolu anlatır.",name:"Adının Keldani titreşimi — dünyada nasıl tanındığını ve kaderinin dışa yansıyan yüzünü gösterir.",soul:"Adındaki sesli harflerden doğar — kalbinin gerçekte ne istediğini, seni içten neyin beslediğini fısıldar.",pers:"Adındaki sessiz harflerden gelir — insanların seni ilk gördüğünde algıladığı dış yüzündür.",birth:"Doğduğun günün sayısı — doğuştan gelen yeteneğin ve kendini gördüğün penceredir.",year:"İçinde bulunduğun yılın enerjisi — bu dönemde neye yönelmenin senin lehine olduğunu söyler."},vx={1:"Yeni bir döngünün başı: tohum atma, cesur kararlar ve yeniden doğuş yılı.",2:"Sabır, ilişkiler ve işbirliği yılı; acele etme, bağlar olgunlaşsın.",3:"Yaratıcılık, sosyallik ve kendini ifade etme yılı; neşe kapını çalıyor.",4:"Emek, düzen ve temel atma yılı; disiplinin karşılığını görürsün.",5:"Değişim, özgürlük ve hareket yılı; beklenmedik fırsatlara açık ol.",6:"Sevgi, aile, sorumluluk ve yuva yılı; kalbin ve evin öne çıkar.",7:"İçe dönüş, öğrenme ve ruhsal derinleşme yılı; sessizlikte cevap bulursun.",8:"Güç, bereket ve maddi hasat yılı; emeklerin somut karşılığa dönüşür.",9:"Tamamlanma ve bırakma yılı; eski
