","cesaret · korkuyu aşmak","Melekler cesur olmanı istiyor: içindeki korkuya rağmen o adımı at. Güç zaten sende; bir nefeslik cesaret yeter."],[3,"Koruma","güven · kalkan","Korunuyorsun. Görünür-görünmez tehlikelere karşı melekler etrafında bir kalkan örüyor; güvende olduğunu bil, endişeyi bırak."],[4,"Eyleme Geç","eylem · başlangıç","Beklemenin vakti geçti; harekete geçme zamanı. Küçük de olsa bir adım at, kapı sen yürüdükçe açılır."],[5,"Sınır Koy","sınır · öz-saygı","Kendini korumak bencillik değil. Enerjini tüketen şeye ya da kişiye nazikçe 'hayır' demen için melekler yanında."],[6,"Öz-Güven","güven · değer","Kendine güven; değerin başkasının onayına bağlı değil. Bu kart, içindeki gücü hatırlaman için geldi."],[7,"Tutku","tutku · kalp","Kalbini yakan şeyin peşinden git. Tutku, ruhunun sana 'bu yol senin' deme biçimidir."],[8,"Liderlik","liderlik · ilham","Öne çıkma, yön verme vakti. Başkalarına ilham olacak ışığın var; sorumluluğu üstlenmekten çekinme."],[9,"Arınma","arınma · hafifleme","Ağırlaştıran eski enerjiyi bırak. Melekler seni temizliyor; kızgınlığı ve yorgunluğu ateşe ver, hafifle."],[10,"İrade Gücü","irade · azim","İçindeki irade sandığından güçlü. Kararında dur, vazgeçme; azminle imkânsızı eğer."],[11,"Yeniden Doğuş","yenilenme · dönüşüm","Bir dönem kapanıyor, yenisi doğuyor. Küllerinden doğan bir ateşsin; geçmişi bırak, yeni ateşi yak."],[12,"Başmelek Cebrail","müjde · sezgi",'Müjde ve sezginin başmeleği; Su serisinin yöneticisidir. İçindeki sesi duyman ve yeni bir başlangıca güvenmen için yanında; yaratıcılığını açar. Mesajı: "Güzel bir haber yolda."'],[13,"Sevgi","sevgi · kalp","Sevgi kapını çalıyor. Melekler kalbini açmanı istiyor; hem vermeye hem almaya izin ver."],[14,"Sezgi","iç ses · his","İç sesin haklı. O ilk hissi görmezden gelme; cevap çoktan içine fısıldandı."],[15,"Duygularını Onurlandır","duygu · kabul","Hissettiğin şey geçerli. Duygularını bastırma; onları nazikçe kabul et, akıp geçmelerine izin ver."],[16,"Öz-Şefkat","şefkat · nezaket","Kendine, sevdiğin birine davranır gibi davran. Kendini yargılamayı bırak, yumuşa."],[17,"Affet","affetme · bırakma","Bir yükü bırakma vakti. Affetmek onu değil seni özgürleştirir; kalbindeki taşı indir."],[18,"Teslim Ol","akış · güven","Her şeyi kontrol etmek zorunda değilsin. Akışa güven; melekler senin için en hayırlısını dokuyor."],[19,"Rüya & İşaretler","rüya · sembol","Etrafındaki işaretlere ve rüyalarına dikkat et. Melekler seninle sembollerle konuşuyor."],[20,"İç Ses","sessizlik · rehberlik","Dışarının gürültüsünü kıs, içeriyi dinle. Aradığın rehberlik senin sessizliğinde."],[21,"Duygusal Şifa","şifa · onarım","Eski bir yara kapanıyor. Melekler kalbindeki kırığı sarıyor; iyileşmene izin ver, acele etme."],[22,"İlişki & Uyum","bağ · huzur","Bir bağ derinleşiyor ya da onarılıyor. Sevgiyle, sabırla yaklaş; aranıza huzur geliyor."],[23,"Başmelek Rafael","şifa · berraklık",'Şifanın başmeleği; Hava serisinin yöneticisidir. Beden-zihin-ruh sağlığında ve bir yarıyı iyileştirmede yanında; zihnini berraklaştırır. Mesajı: "İyileşeceksin."'],[24,"Şifa","iyileşme · özen","İyileşme başladı. Kendine iyi bak; melekler bedenine ve ruhuna şifa taşıyor, sabırlı ol."],[25,"Berraklık","netlik · sabır","Sis dağılıyor. Kafan karışıksa bekle; cevap yakında netleşecek, zorlama."],[26,"İletişim","ifade · söz","Konuş, ifade et, sustuğunu söyle. Açık ve nazik bir söz düğümü çözecek."],[27,"Hakikat","gerçek · dürüstlük","Gerçeği gör ve söyle. Melekler perdenin ardını göstermene, dürüst olmana destek veriyor."],[28,"İlham","fikir · yaratıcılık","Bir fikir kapını çalıyor. Zihnini aç; ilham bir melek dokunuşudur, onu yakala."],[29,"Zihnini Sakinleştir","sükunet · nefes","Aşırı düşünmeyi bırak. Bir nefes al; melekler zihnindeki fırtınayı dindiriyor."],[30,"Öğrenme & Bilgi","öğrenme · yol","Öğrenmeye açık ol. Bir bilgi, bir ders, bir kitap tam da şimdi sana yol gösterecek."],[31,"Bakış Açını Değiştir","perspektif · esneklik","Soruna başka bir pencereden bak. 'Aynı manzara farklı yerden güzel' diyor melekler."],[32,"Özgürlük","özgürlük · kanat","Seni sıkan kalıbı gevşet. Ruhun özgürlük istiyor; kanatlarını açmana izin ver."],[33,"Endişeyi Sal","teslimiyet · huzur","Endişeni meleklere bırak. Taşıdığın yükünün çoğu daha olmadı bile; bugüne dön, nefes al."],[34,"Başmelek Uriel","bilgelik · istikrar",'Bilgelik ve istikrarın başmeleği; Toprak serisinin yöneticisidir. Çözülmeyen bir sorunu aydınlatman ve ayaklarını yere basmanda yanında. Mesajı: "İçindeki bilgelik yolu aydınlatacak."'],[35,"Bolluk","bolluk · açıklık","Bolluk sana akıyor. Kıtlık korkusunu bırak; açık ellerle ver ve al, kucağın dolsun."],[36,"Bereket & Şans","bereket · fırsat","Şans kapıları aralanıyor. Emeğin bereketle dönecek; fırsatı gördüğünde 'evet' de."],[37,"Sabır","sabır · zamanlama","Acele etme; her şey doğru zamanında. Tohum toprakta olgunlaşıyor, güven ve bekle."],[38,"Sağlam Temel","istikrar · inşa","Kalıcı bir şey inşa ediyorsun. Yavaş ama sağlam ilerle; melekler temelini tutuyor."],[39,"Sağlık & Beden","sağlık · denge","Bedenine kulak ver. Dinlen, beslen, hareket et; melekler sağlığına özen göstermeni istiyor."],[40,"Şükür","şükür · minnet","Sahip olduklarına şükret. Şükür bereketin anahtarıdır; bugün üç güzelliği say."],[41,"Şimdiye Dön","topraklanma · an","Zihnin geleceğe kaçıyorsa geri dön. Ayaklarını yere bas, bu ana gel; huzur şimdide."],[42,"Emek & Sadakat","emek · sebat","Emeğin boşa gitmiyor. Sabırla ve sadakatle çalışmaya devam et; karşılığı katlanarak gelecek."],[43,"Yeterlilik","değer · güven","Yeterince iyisin, yeterince varsın. Melekler 'eksik değilsin' diyor; kendine güven."],[44,"Nimet","kutsanma · lütuf","Görünmez bir bereketle kutsanıyorsun. Fark et, minnet duy; iyi şeyler yolda ve sen bunu hak ediyorsun."]],U1=hF.map(([t,e,n,r])=>({img:`${dF}/melek/melek-${String(t).padStart(2,"0")}.webp`,name:e,kicker:n,meaning:r}));function fF({item:t,list:e,onSelect:n,onBack:r}){return d.jsxs(Te.div,{initial:{opacity:0,y:24},animate:{opacity:1,y:0},exit:{opacity:0,y:-24},tra başkalarına güven ve umut verebilmen.",kader:"Kaderin görünür olmakla ilgilidir — adının duyulduğu, emeğinin takdir gördüğü, sorumluluk aldığın yollara çıkarsın. Hayatın seni tekrar tekrar öne, sahneye, yöneticiliğe çağırır. En parladığın an, ışığını yalnız kendin için değil, başkalarını ısıtmak için kullandığın andır; verdikçe büyürsün.",ogut:"Gururunu bir zırh sanma; kırılganlığını göstermek seni küçültmez. Ama herkesin senin etrafında dönmesini beklersen yalnız kalırsın — ışığını paylaş, tek başına parlama.",ask:"Aşkta sıcak, sadık ve koruyucusun; sevdiğini gururla sahiplenir, el üstünde tutarsın. Değerinin görülmesine ve takdir edilmeye ihtiyacın var — kalbi kazanılan bir Şems dünyayı sevgilisine açar. Yeter ki her şeyin çevrende dönmesini bekleme; karşındakinin de kendi ışığıyla parlamasına izin verdiğinde beraberlik gerçekten aydınlanır.",is:'İş hayatında liderlik, yöneticilik ve öne çıkmak senin doğanda; emir almaktan çok yön vermeye yatkınsın. Yönetim, sanat, itibar ve "altın" işlerinde, insanları bir amaç etrafında toplayacağın her yerde rızkın açıktır. Adın duyuldukça, itibarın büyüdükçe bereketin de artar.',saglik:"Yaşam gücün yüksektir; kolay yıkılmaz, düşsen de çabuk toparlanırsın. Geleneğe göre kalp, sırt ve gözler senin bölgen — stresi ve yorgunluğu kalbine yükleme. Güneşe, harekete ve neşeye aç kalma; ışıktan uzaklaştığında enerjin de söner.",ruh:'Ruhsal olgunluğun "ben"den "biz"e geçmekle gelir. Güneş gösteriş için değil, çevresine hayat vermek için parlar; sen de en çok verdiğinde huzur bulursun. Kibri bırakıp şükrü öğrendiğinde içindeki ışık gerçek bir aydınlığa döner.'},kamer:{ad:"Kamer",mod:"Ay",sym:"☾",no:2,gun:"Pazartesi",renk:"İnci beyazı, gümüş, gök mavisi",renkHex:"#cfd8e3",tas:"İnci ve aytaşı",kw:"Sezgi · Duygu · Şefkat",char:"Yıldızın Kamer, yani Ay. Duyguların derin ve gel-gitlidir; çevreni sezgiyle okur, söylenmeyeni hissedersin. Şefkatli, hayal gücü güçlü, koruyucu bir yanın var — insanlar yanında kendini güvende hisseder. İçinde bir çocuk saflığı ve bir anne sıcaklığı aynı anda yaşar.",kader:"Kaderin dalgalar hâlinde ilerler: inişli çıkışlı ama akışkan. Bir dönem çekilir, bir dönem dolarsın; bu senin zayıflığın değil, ritmin. Suyun taşı zamanla yontması gibi, sabırla ve sezgiyle en sert kapıları yumuşatırsın. Yuva, aile ve şefkatle kurduğun bağlar kaderinin can damarıdır.",ogut:"Duygularına kapılıp savrulma; ama onları bastırma da — sezgin senin pusulan. Her hissi büyütmeden önce bir gece bekle, sabah daha berrak görürsün.",ask:"Aşkta derin, şefkatli ve bağlanan bir kalbin var; sevdiğine yuva kurar, onu duygusal olarak sararsın. Güven hissettiğinde açılır, tehdit sezdiğinde kabuğuna çekilirsin. Sana sabırla ve sıcaklıkla yaklaşan biri, kalbinin en derin sularını görür — asıl mesele sevilmek kadar güvende hissetmektir.",is:"Rızkın halkla, hizmetle ve akışkan işlerle açılır: yiyecek-içecek, su, seyahat, emlak, bakım ve insanlarla birebir temas. Sezgin ticarette pusuladır; ortamın nabzını tutmayı bilirsin. Kaderin gibi kazancın da gel-gitlidir — bollukta biriktirmeyi öğrenirsen darlıkta rahat edersin.",saglik:"Bedenin duygularının aynasıdır; stres önce mideni ve uykunu vurur. Geleneğe göre mide, göğüs ve vücut sıvıları senin bölgen; su içmek, dinlenmek ve içini boşaltmak sana şifadır. Ay gibi ritmini tanı — kendini zorladığın değil, aktığın dönemlerde güçlüsün.",ruh:"Ruhsal gücün sezgindedir; içindeki sesi bastırdıkça yorulur, dinledikçe berraklaşırsın. Duyguyu düşman değil rehber bil. Geçmişi ve incinmeleri suya bırakmayı öğrendiğinde için huzurla dolar."},utarit:{ad:"Utarit",mod:"Merkür",sym:"☿",no:5,gun:"Çarşamba",renk:"Turkuaz, açık mavi, yeşil",renkHex:"#3aa6b9",tas:"Zümrüt ve akik",kw:"Zekâ · Söz · Ticaret",char:"Yıldızın Utarit, yani Merkür. Zekân hızlı, dilin akıcı, öğrenmen çabuktur. Kelimelerle, fikirlerle, alışverişle aran iyidir; bir konuyu kavrayıp başkasına anlatmak senin doğal yeteneğin. Meraklı ve çok yönlüsün, tek bir işe sığmazsın; elin de dilin de pratiktir.",kader:"Kaderin bilgi ve iletişim yollarından geçer: yazı, sözleşme, ticaret, öğretmenlik, aracılık… Söz söyleyeceğin, bağ kuracağın, alıp satacağın yerlerde şansın açıktır. Doğru bilgiyi doğru zamanda söylemek sana kapılar açar; kalemin ve dilin kaderinin anahtarıdır.",ogut:"Zihnin çok hızlı çalışıyor; bazen dur ve başladığın işi bitir. Her yöne koşarsan gücün de dağılır — bir kanala aktığında nehir olursun.",ask:"Aşkta önce zihnin bağlanır; seni güldüren, seninle konuşabilen biri kalbini de açar. Sohbet, mektup, kelime senin sevgi dilin. Fazla analiz edip duyguyu kafanda eritme; bazen düşünmeden hissetmek gerekir.",is:"Rızık kapın söz ve bilgiden geçer: yazı, ticaret, öğretmenlik, aracılık, medya, hesap ve sözleşme. Doğru bilgiyi doğru zamanda söylemek sana kapı açar; kalemin ve dilin kaderinin anahtarı. Tek işe sığmaz, birden çok gelir kanalını rahat yönetirsin.",saglik:'Enerjin zihninde toplanır; en çok sinir sistemin, ellerin ve nefesin (akciğer) yorulur. Aşırı düşünce uykunu kaçırır — zihnini durdurmayı, nefes almayı öğren. Bedenin dinlenmekten çok "boşalmaya" ihtiyaç duyar: yaz, konuş, yürü, hafifle.',ruh:"Ruhsal yolun dağınık zihni toplamaktan geçer. Her yöne koşan aklını tek bir niyete akıttığında güç bir nehre döner. Bildiğini paylaşmak seni bilgelikle besler."},zuhre:{ad:"Zühre",mod:"Venüs",sym:"♀",no:6,gun:"Cuma",renk:"Yeşil, pembe, pastel tonlar",renkHex:"#4CAF7D",tas:"Zümrüt ve pembe kuvars",kw:"Sevgi · Güzellik · Uyum",char:"Yıldızın Zühre, yani Venüs. Sevgi, güzellik ve uyum senin doğanda. Estetik bir gözün, insanları yumuşatan bir çekimin var; sanat, zarafet ve ilişkiler senin alanın. Kavgadan değil, uzlaşmadan güç alırsın; girdiğin ortama incelik ve huzur taşırsın.",kader:"Kaderin sevgi ve ortaklıklar üzerinden şekillenir. Güzel şeyler seni bulur, insanlar sana iyilik yapmak ister; çoğu kapı senin için sevgiyle açılır. Bir işi tek başına zorlamaktan çok, doğru kişiyle el ele vererek büyürsün. Aşk, dostluk ve ortaklık kaderinin taşıyıcı sütunudur.",ogut:'Herkesi memnun etme derdi seni yorabilir; kendi değerini başkasının onayına bağlama. "Hayır" demeyi öğrendiğinde sevgin daha da kıymetlenir.',ask:"Aşk senin en güçlü alanın; sevgi, çekim ve uyum doğanda. Zarif, romantik ve uzlaşmacısın; girdiğin ilişkiye incelik ve huzur taşırsın. Ama herkesi memnun etme çaban seni silikleştirebilir — sevildiğin kadar kendine de değer ver.",is:"Rızkın sevgi, güzellik ve ortaklıklarla akar: sanat, estetik, moda, diplomasi, halkla ilişkiler, keyif ve konfor işleri. İnsanlar sana iyilik yapmak, seninle çalışmak ister; çoğu kapı senin için sevgiyle açılır. Tek başına zorlamaktan çok, doğru ortakla el ele büyürsün.",saglik:"Bedenin keyfe ve tatlıya düşkün; en çok boğaz, böbrekler ve şeker/denge senin bölgen. Aşırı rahatlık ve tatlı seni ağırlaştırabilir — güzelliğin kadar ölçün de olsun. Sanat, müzik ve doğa sana en iyi gelen şifadır.",ruh:'Ruhsal olgunluğun kendi değerini dışarıdan onaya bağlamamakla gelir. "Hayır" diyebildiğinde sevgin daha da kıymetlenir. Güzelliği sahiplenmek değil, paylaşmak seni yüceltir.'},merih:{ad:"Merih",mod:"Mars",sym:"♂",no:9,gun:"Salı",renk:"Kırmızı, kızıl, bordo",renkHex:"#c0392b",tas:"Yakut ve kızıl akik",kw:"Cesaret · Enerji · Mücadele",char:"Yıldızın Merih, yani Mars. İçinde güçlü bir enerji, cesaret ve mücadele gücü var. Harekete geçmekten korkmazsın; engel gördüğünde geri çekilmez, üstüne gidersin. Açık sözlü, atılgan ve korunmacısın — haksızlığa tahammülün yoktur, sevdiğin için savaşırsın.",kader:"Kaderin mücadeleyle ve cesaretle açılır. Rekabetin, sporun, girişimin, öncülüğün olduğu yerde parlarsın; kolay kazanılan değil, savaşarak kazanılan zaferler senindir. Hayat seni sık sık sınar ama her sınav seni güçlendirir — düştüğün yerden daha sert kalkarsın.",ogut:"Öfken en büyük enerjin ama en büyük tuzağın; onu yıkmak için değil, kurmak için kullan. Sabretmeyi öğrenen bir Merih durdurulamaz.",ask:"Aşkta tutkulu, koruyucu ve sahiplenicisin; sevdiğin için savaşır, önüne geçilmezsin. Ateşin çeker ama kıskançlık ve inat i
