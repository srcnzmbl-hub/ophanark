<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPHANARK · Reset password</title>
<style>
  :root{--bg:#F7F3E8;--ink:#25181C;--gold:#9a6c2e;--line:rgba(37,24,28,.16);--serif:'Georgia',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink)}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--serif);padding:22px}
  .card{width:min(380px,100%);text-align:center}
  .brand{font-family:var(--sans);font-size:13px;letter-spacing:.28em;color:var(--muted,#9c8666);text-transform:uppercase;margin-bottom:18px}
  h1{font-weight:400;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(28px,9vw,40px);margin:0 0 6px}
  p.sub{font-style:italic;color:#5a4a44;margin:0 0 26px;font-size:16px}
  .f{text-align:left}
  input{width:100%;margin-bottom:16px;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;font-family:var(--serif);font-size:18px;color:var(--ink);outline:none}
  input:focus{border-color:var(--gold)}
  input::placeholder{color:#b9ac93}
  button{width:100%;margin-top:8px;font-family:var(--sans);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding:15px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .msg{min-height:20px;margin-top:18px;font-style:italic;font-size:14px;color:#5a4a44}
  a{color:var(--gold);font-family:var(--sans);font-size:12px;letter-spacing:.05em;text-decoration:none}
  .back{margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">OPHANARK</div>
  <h1>New password</h1>
  <p class="sub">Choose a new password for your account.</p>
  <div class="f">
    <input type="password" id="p1" placeholder="New password (min 6 characters)" autocomplete="new-password">
    <input type="password" id="p2" placeholder="Confirm new password" autocomplete="new-password">
    <button id="save" type="button">Update password</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="back"><a href="index.html">&larr; Back to sign in</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  var SB_URL='https://lssyopqxthausyegeire.supabase.co';
  var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzc3lvcHF4dGhhdXN5ZWdlaXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTE4MzEsImV4cCI6MjA5OTc4NzgzMX0.WZeL9kPQmC86m747B3jOOObcNR0If4FADH12VxUpFqo';
  var sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  var msg=document.getElementById('msg'), saveBtn=document.getElementById('save');
  function say(t,ok){ msg.textContent=t; msg.style.color=ok?'#3f7d4a':(ok===false?'#b12a1e':'#5a4a44'); }

  // The recovery token arrives in the URL; detectSessionInUrl parses it.
  var haveSession=false;
  sb.auth.onAuthStateChange(function(ev,session){ if(session){ haveSession=true; } });
  sb.auth.getSession().then(function(r){
    if(r&&r.data&&r.data.session){ haveSession=true; return; }
    setTimeout(function(){
      sb.auth.getSession().then(function(r2){
        if(!(r2&&r2.data&&r2.data.session)){
          say('This reset link is invalid or has expired. Please request a new one from the sign-in screen.',false);
          saveBtn.disabled=true;
        }
      });
    },1500);
  });

  saveBtn.addEventListener('click',function(){
    var a=document.getElementById('p1').value||'', b=document.getElementById('p2').value||'';
    if(a.length<6){ say('Password must be at least 6 characters.',false); return; }
    if(a!==b){ say('Passwords do not match.',false); return; }
    say('Updating your password…');
    saveBtn.disabled=true;
    sb.auth.updateUser({password:a}).then(function(res){
      if(res.error){ say(res.error.message||'Could not update password. The link may have expired.',false); saveBtn.disabled=false; return; }
      say('Password updated! Redirecting you in…',true);
      setTimeout(function(){ location.href='scroll.html'; },1100);
    }).catch(function(){ say('Could not update password. Please try again.',false); saveBtn.disabled=false; });
  });
</script>
</body>
</html>
