<style>
  :root{ --bg:#f3ecdd; --ink:#231613; --gold:#9a6c2e; --muted:#8a7a72; --line:rgba(154,108,46,.28);
    --disp:'Georgia',serif; --serif:'Georgia',serif; --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --vh:100vh; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); }
  body{ font-family:var(--serif); display:flex; flex-direction:column; align-items:center; height:100dvh; }
  /* masaüstünde ortalı, dar bir kolon; mobilde tam genişlik */
  .shell{ width:100%; max-width:820px; height:100dvh; display:flex; flex-direction:column; background:var(--bg); }
  @media(min-width:860px){ .shell{ border-left:1px solid var(--line); border-right:1px solid var(--line); box-shadow:0 0 60px rgba(20,14,10,.05); } }
  a{ color:inherit; }
  .backlink{ flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 10px; border-bottom:1px solid var(--line); }
  .backlink a{ font-family:var(--sans); font-size:13px; letter-spacing:.04em; color:var(--muted); text-decoration:none; }
  .brandmini{ font-family:var(--sans); font-size:12px; letter-spacing:.22em; color:var(--muted); }
  /* Ophan başlık */
  .ophhead{ flex:none; display:flex; align-items:center; gap:12px; padding:14px 20px; border-bottom:1px solid var(--line); background:rgba(255,252,245,.5); }
  .ophav{ width:50px; height:50px; min-width:50px; border-radius:50%; border:1px solid var(--gold); overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 35%, #fff8ec, #efe2c9); }
  .ophav canvas{ width:100%!important; height:100%!important; display:block; }
  .ophhead h1{ margin:0; font-family:var(--disp); font-size:20px; letter-spacing:.02em; font-weight:600; }
  .ophhead .st{ font-family:var(--sans); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-top:2px; }
  .ophhead .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:#3fae6a; margin-right:5px; vertical-align:middle; }
  /* mesajlar */
  #chat{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:20px 16px 8px;
    display:flex; flex-direction:column; gap:14px; }
  .wrap{ width:100%; max-width:680px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .msg{ max-width:82%; padding:12px 15px; line-height:1.55; font-size:16px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.oph{ align-self:flex-start; background:#fffdf7; border:1px solid var(--line); border-bottom-left-radius:5px; color:var(--ink); box-shadow:0 2px 8px rgba(20,14,10,.05); }
  .msg.usr{ align-self:flex-end; background:var(--ink); color:#f3ecdd; border-bottom-right-radius:5px; font-family:var(--sans); font-size:15.5px; }
  .msg.oph .who{ display:block; font-family:var(--sans); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:5px; }
  /* yazıyor */
  .typing{ align-self:flex-start; display:flex; gap:5px; padding:14px 16px; background:#fffdf7; border:1px solid var(--line); border-radius:16px; border-bottom-left-radius:5px; }
  .typing span{ width:7px; height:7px; border-radius:50%; background:var(--gold); opacity:.5; animation:bl 1s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes bl{ 0%,60%,100%{ transform:translateY(0); opacity:.35 } 30%{ transform:translateY(-4px); opacity:.9 } }
  /* girdi */
  .inbar{ flex:none; border-top:1px solid var(--line); background:rgba(255,252,245,.85); backdrop-filter:blur(6px);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .inrow{ max-width:680px; margin:0 auto; display:flex; align-items:flex-end; gap:9px; }
  #inp{ flex:1; resize:none; max-height:140px; min-height:46px; padding:12px 14px; font-family:var(--serif); font-size:16px;
    color:var(--ink); background:#fff; border:1px solid var(--line); border-radius:22px; outline:none; line-height:1.4; }
  #inp:focus{ border-color:var(--gold); }
  #snd{ flex:none; width:46px; height:46px; border-radius:50%; border:none; background:var(--ink); color:#f3ecdd;
    font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity .15s; }
  #snd:disabled{ opacity:.35; cursor:default; }
  .hint{ max-width:680px; margin:6px auto 0; text-align:center; font-family:var(--sans); font-size:10.5px; letter-spacing:.03em; color:var(--muted); }

 <div class="shell">

      <h1>Ophan AI</h1>

  <div id="chat"><div class="wrap" id="wrap"></div></div>

 </div><!-- /.shell -->

<script type="importmap">{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }</script>
<script type="module">
  import { OphanCarklar } from "./ophan_carklar.js";
  try{
    var _av=document.getElementById('ophav');
    if(_av) OphanCarklar.olustur(_av, { url:"model/carklar_m.glb", dracoPath:"./vendor/addons/libs/draco/", hiz:1.1 });
  }catch(e){}
</script>

<script>
  var SB="https://lssyopqxthausyegeire.supabase.co";
  var KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxzc3lvcHF4dGhhdXN5ZWdlaXJlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMTE4MzEsImV4cCI6MjA5OTc4NzgzMX0.WZeL9kPQmC86m747B3jOOObcNR0If4FADH12VxUpFqo";
  var LANG=(function(){ try{ return (localStorage.getItem('oph_lang')||'tr').slice(0,2); }catch(e){ return 'tr'; } })();

  var wrap=document.getElementById('wrap'), chat=document.getElementById('chat');
  var inp=document.getElementById('inp'), snd=document.getElementById('snd');
  var msgs=[];          // {role:'user'|'model', text}
  var busy=false;

  var GREETING="Merhaba, ben Ophan. Gözlerini kapadığında gördüklerin bazen sana bir şey fısıldamak ister. Anlat bakalım — rüyanda ne gördün? Detaylar, duygular, kim vardı, neredeydin… ne hatırlıyorsan yaz, birlikte bakalım.";

  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function scrollDown(){ chat.scrollTop=chat.scrollHeight; }

  function addBubble(role, text){
    var d=document.createElement('div');
    d.className='msg '+(role==='model'?'oph':'usr');
    if(role==='model'){ d.innerHTML='<span class="who">Ophan AI</span>'+esc(text); }
    else { d.textContent=text; }
    wrap.appendChild(d); scrollDown(); return d;
  }
  function showTyping(){
    var t=document.createElement('div'); t.className='typing'; t.id='typing';
    t.innerHTML='<span></span><span></span><span></span>';
    wrap.appendChild(t); scrollDown(); return t;
  }
  function hideTyping(){ var t=document.getElementById('typing'); if(t) t.parentNode.removeChild(t); }

  function setBusy(b){ busy=b; snd.disabled=b || !inp.value.trim(); }

  function autoGrow(){ inp.style.height='auto'; inp.style.height=Math.min(140, inp.scrollHeight)+'px'; snd.disabled=busy || !inp.value.trim(); }
  inp.addEventListener('input', autoGrow);

  function send(){
    var text=inp.value.trim(); if(!text || busy) return;
    addBubble('user', text); msgs.push({role:'user', text:text});
    inp.value=''; autoGrow(); setBusy(true);
    var typing=showTyping();
    fetch(SB+'/functions/v1/ruya-sohbet',{ method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':KEY, 'Authorization':'Bearer '+KEY },
      body:JSON.stringify({ messages:msgs, lang:LANG })
    }).then(function(r){ return r.json(); }).then(function(j){
      hideTyping();
      if(j && j.text){ addBubble('model', j.text); msgs.push({role:'model', text:j.text}); }
      else { addBubble('model', 'Bir an dalıp gitmişim, yorumu toparlayamadım. Rüyanı bir daha yazar mısın?'); }
      setBusy(false); inp.focus();
    }).catch(function(){
      hideTyping();
      addBubble('model', 'Şu an bağlantıda bir pürüz var gibi. Az sonra tekrar dener misin?');
      setBusy(false);
    });
  }

  snd.addEventListener('click', send);
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
  });

  // acilis
  addBubble('model', GREETING);   // sadece ekranda; gecmise eklenmez ki model kendini tekrar etmesin
  setBusy(false);
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 300);
</script>
